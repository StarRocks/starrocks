syntax = "proto3";

package starrocks.persist;

option java_package = "com.starrocks.persist.proto";
option java_multiple_files = true;
option java_outer_classname = "WarehouseProto";

// The warehouse domain: the compute resources jobs and loads run on now, the warehouses themselves
// when WarehouseMgr is persisted. See common.proto for the conventions.

// com.starrocks.warehouse.cngroup.ComputeResource.
message ComputeResourcePB {
  enum Kind {
    UNSPECIFIED = 0;
    WAREHOUSE = 1;
  }
  Kind kind = 1;

  oneof instance {
    WarehouseComputeResourcePB warehouse = 11;
  }
}

// com.starrocks.warehouse.cngroup.WarehouseComputeResource.
message WarehouseComputeResourcePB {
  int64 warehouse_id = 1;
}
