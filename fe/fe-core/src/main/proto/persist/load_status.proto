syntax = "proto3";

package starrocks.persist;

import "persist/common.proto";

option java_package = "com.starrocks.persist.proto";
option java_multiple_files = true;
option java_outer_classname = "LoadStatusProto";

message FailMsgPB {
  enum CancelType {
    UNSPECIFIED = 0;
    USER_CANCEL = 1;
    ETL_SUBMIT_FAIL = 2;
    ETL_RUN_FAIL = 3;
    ETL_QUALITY_UNSATISFIED = 4;
    LOAD_RUN_FAIL = 5;
    TIMEOUT = 6;
    UNKNOWN = 7;
    TXN_UNKNOWN = 8;
  }
  optional CancelType cancel_type = 1;
  optional string msg = 2;
}

message LoadStatisticPB {
  LoadCounterTablePB counter_tbl = 1;
  LoadCounterTablePB source_scan_bytes_counter_tbl = 2;
  LoadCounterTablePB sink_bytes_counter_tbl = 3;
  LoadCounterTablePB source_rows_counter_tbl = 4;
  LoadCounterTablePB source_bytes_counter_tbl = 5;
  LoadCounterTablePB filtered_rows_counter_tbl = 6;
  LoadCounterTablePB unselected_rows_counter_tbl = 7;
  LoadBackendIdsPB unfinished_backend_ids = 8;
  LoadBackendIdsPB all_backend_ids = 9;
  optional int32 file_num = 10;
  optional int64 total_file_size_b = 11;
  optional int64 num_scan_range = 12;
  optional bool load_finish = 13;
}

message LoadCounterTablePB {
  message Cell {
    string row = 1;
    string column = 2;
    int64 value = 3;
  }
  repeated Cell cells = 1;
}
message LoadBackendIdsPB {
  map<string, Int64ListPB> values = 1;
}

message EtlStatusPB {
  enum State {
    UNSPECIFIED = 0;
    RUNNING = 1;
    FINISHED = 2;
    CANCELLED = 3;
    UNKNOWN = 4;
  }
  optional State state = 1;
  optional string tracking_url = 2;
  StringMapPB stats = 3;
  LoadStatisticPB load_statistic = 4;
  StringMapPB counters = 5;
}
