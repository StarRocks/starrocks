syntax = "proto3";

package starrocks.persist;

import "persist/common.proto";
import "persist/type.proto";

option java_package = "com.starrocks.persist.proto";
option java_multiple_files = true;
option java_outer_classname = "FunctionProto";

// The com.starrocks.catalog.Function hierarchy: user-defined functions and everything they
// reference. See common.proto for the conventions.

// com.starrocks.catalog.Function.
message FunctionPB {
  enum Kind {
    UNSPECIFIED = 0;
    SCALAR = 1;
    AGGREGATE = 2;
    TABLE = 3;
    SQL = 4;
  }
  Kind kind = 1;
  FunctionCorePB core = 2;

  oneof instance {
    ScalarFunctionPB scalar = 11;
    AggregateFunctionPB aggregate = 12;
    TableFunctionPB table = 13;
    SqlFunctionPB sql = 14;
  }
}

// The fields declared by the Function base class, shared by every kind.
message FunctionCorePB {
  // com.starrocks.thrift.TFunctionBinaryType.
  enum BinaryType {
    BINARY_TYPE_UNSPECIFIED = 0;
    BUILTIN = 1;
    HIVE = 2;
    NATIVE = 3;
    IR = 4;
    SRJAR = 5;
    PYTHON = 6;
    AI = 7;
  }
  int64 fid = 1;
  FunctionNamePB name = 2;
  TypePB ret_type = 3;
  repeated TypePB arg_types = 4;
  StringListPB arg_names = 5;
  bool has_var_args = 6;
  bool user_visible = 7;
  optional BinaryType binary_type = 8;
  reserved 9;
  HdfsURIPB location = 10;
  optional string checksum = 11;
  AggStateDescPB agg_state_desc = 12;
  CloudConfigurationPB cloud_configuration = 13;
  optional string input_type = 14;
}

message FunctionNamePB {
  optional string db = 1;
  optional string fn = 2;
}

message HdfsURIPB {
  string location = 1;
}

// com.starrocks.credential.CloudConfiguration persists no fields; the message only records that
// the Java reference was not null.
message CloudConfigurationPB {
}

message ScalarFunctionPB {
  optional string symbol_name = 1;
  optional string prepare_fn_symbol = 2;
  optional string close_fn_symbol = 3;
  bool isolated = 4;
  optional string content = 5;
  optional string service_url = 6;
}

message AggregateFunctionPB {
  TypePB intermediate_type = 1;
  optional string symbol_name = 2;
  bool ignores_distinct = 3;
  bool is_analytic_fn = 4;
  bool is_aggregate_fn = 5;
  bool returns_non_null_on_empty = 6;
  bool isolated = 7;
}

message TableFunctionPB {
  StringListPB default_column_names = 1;
  TypeListPB table_fn_return_types = 2;
  optional string symbol_name = 3;
}

message SqlFunctionPB {
  optional string sql = 1;
}
