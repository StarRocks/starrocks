syntax = "proto3";

package starrocks.persist;

option java_package = "com.starrocks.persist.proto";
option java_multiple_files = true;
option java_outer_classname = "EncryptionKeyProto";

// Image-only schema. The BE/RPC encryption_key protocol remains unchanged.
message ImageEncryptionKeyPB {
  enum Kind {
    UNSPECIFIED = 0;
    NORMAL = 1;
  }
  Kind kind = 1;
  optional int64 id = 2;
  optional int64 parent_id = 3;
  optional int64 create_time = 4;
  oneof instance {
    NormalEncryptionKeyPB normal = 11;
  }
}

message NormalEncryptionKeyPB {
  enum Algorithm {
    UNSPECIFIED = 0;
    NO_ENCRYPTION = 1;
    AES_128 = 2;
  }
  optional Algorithm algorithm = 1;
  optional bytes encrypted_key = 2;
  optional bytes plain_key = 3;
}
