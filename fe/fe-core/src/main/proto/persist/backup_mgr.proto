syntax = "proto3";

package starrocks.persist;

import "persist/common.proto";
import "persist/export_mgr.proto";

option java_package = "com.starrocks.persist.proto";
option java_multiple_files = true;
option java_outer_classname = "BackupMgrProto";

message BlobStoragePB {
  optional string broker_name = 1;
  StringMapPB properties = 2;
  optional bool has_broker = 3;
  BrokerPropertiesPersistInfoPB broker_persist_info = 4;
}

message RepositoryPB {
  optional int64 id = 1;
  optional string name = 2;
  optional int64 create_time = 3;
  optional bool is_read_only = 4;
  optional string location = 5;
  BlobStoragePB storage = 6;
}

message RepositoryMgrPB {
  repeated RepositoryPB repositories = 1;
}

message BackupMgrPB {
  RepositoryMgrPB repo_mgr = 1;
}
