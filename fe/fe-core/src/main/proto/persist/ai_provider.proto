syntax = "proto3";

package starrocks.persist;

import "persist/common.proto";

option java_package = "com.starrocks.persist.proto";
option java_multiple_files = true;
option java_outer_classname = "AIProviderProto";

message AIProviderPB {
  enum Type { UNSPECIFIED = 0; EMBEDDING = 1; RERANK = 2; CHAT = 3; }
  optional string id = 1;
  optional string name = 2;
  optional Type type = 3;
  StringMapPB params = 4;
  optional string comment = 5;
}
message AIProviderDefaultPB { AIProviderPB.Type type = 1; string provider_id = 2; }
message AIProviderMgrPB {
  optional string default_provider_id = 1;
  repeated AIProviderDefaultPB defaults = 2;
}
message AIProviderEntryPB { string id = 1; AIProviderPB provider = 2; }
