syntax = "proto3";

package starrocks.persist;

import "persist/common.proto";

option java_package = "com.starrocks.persist.proto";
option java_multiple_files = true;
option java_outer_classname = "PluginMgrProto";

message PluginMgrPB {}

message DigitalVersionPB {
  // All four fields are persisted by v2, including IDs with a nonzero suffix.
  optional int32 id = 1;
  optional int32 major = 2;
  optional int32 minor = 3;
  optional int32 revision = 4;
}

message PluginInfoPB {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    AUDIT = 1;
    IMPORT = 2;
    STORAGE = 3;
  }
  optional string name = 1;
  optional Type type = 2;
  optional string description = 3;
  DigitalVersionPB version = 4;
  DigitalVersionPB java_version = 5;
  optional string class_name = 6;
  optional string so_name = 7;
  optional string source = 8;
  StringMapPB properties = 9;
}
