syntax = "proto3";

package starrocks.persist;

import "persist/common.proto";

option java_package = "com.starrocks.persist.proto";
option java_multiple_files = true;
option java_outer_classname = "AuthenticationMgrProto";

message UserAuthenticationInfoPB {
  optional bytes password = 1;
  optional string auth_plugin = 2;
  optional string auth_string = 3;
  optional string orig_host = 4;
  optional string orig_user = 5;
}

message UserPropertyPB {
  optional int64 max_conn = 1;
  optional string database = 2;
  optional string catalog = 3;
  StringMapPB session_variables = 4;
}
message AuthenticationMgrPB {}
message AuthenticationUserPropertyEntryPB {
  optional string user_name = 1;
  UserPropertyPB property = 2;
}

message AuthenticationUserAuthenticationEntryPB {
  UserIdentityPB user = 1;
  UserAuthenticationInfoPB authentication = 2;
}

message GroupProviderPB {
  enum Kind {
    UNSPECIFIED = 0;
    FILE = 1;
    UNIX = 2;
    LDAP = 3;
  }
  Kind kind = 1;
  optional string name = 2;
  StringMapPB properties = 3;
}

message SecurityIntegrationPB {
  enum Kind {
    UNSPECIFIED = 0;
    JWT = 1;
    LDAP = 2;
    OAUTH2 = 3;
  }
  Kind kind = 1;
  optional string name = 2;
  StringMapPB properties = 3;
}
