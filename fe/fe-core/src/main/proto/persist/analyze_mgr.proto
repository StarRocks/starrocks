syntax = "proto3";

package starrocks.persist;

import "persist/common.proto";
import "persist/type.proto";

option java_package = "com.starrocks.persist.proto";
option java_multiple_files = true;
option java_outer_classname = "AnalyzeMgrProto";

// LocalDateTime fields use UTC epoch seconds, matching the v2 GSON adapter.
enum AnalyzeTypePB {
  ANALYZE_UNSPECIFIED = 0;
  ANALYZE_SAMPLE = 1;
  ANALYZE_FULL = 2;
  ANALYZE_HISTOGRAM = 3;
}
enum AnalyzeScheduleTypePB {
  SCHEDULE_UNSPECIFIED = 0;
  SCHEDULE_ONCE = 1;
  SCHEDULE_SCHEDULE = 2;
}
enum AnalyzeScheduleStatusPB {
  STATUS_UNSPECIFIED = 0;
  STATUS_PENDING = 1;
  STATUS_RUNNING = 2;
  STATUS_FINISH = 3;
  STATUS_FAILED = 4;
}
message StatisticsTypeListPB {
  enum Type {
    UNSPECIFIED = 0;
    COMMON = 1;
    HISTOGRAM = 2;
    MCDISTINCT = 3;
  }
  repeated Type values = 1;
}
message ColumnStatsMetaMapPB {
  map<string, ColumnStatsMetaPB> values = 1;
}

message AnalyzeJobCorePB {
  optional int64 id = 1;
  StringListPB columns = 2;
  TypeListPB column_types = 3;
  optional AnalyzeTypePB type = 4;
  optional AnalyzeScheduleTypePB schedule_type = 5;
  StringMapPB properties = 6;
  optional AnalyzeScheduleStatusPB status = 7;
  optional int64 work_time = 8;
  optional string reason = 9;
}

message NativeAnalyzeJobPB {
  optional int64 db_id = 1;
  optional int64 table_id = 2;
}

message ExternalAnalyzeJobPB {
  optional string catalog_name = 1;
  optional string db_name = 2;
  optional string table_name = 3;
}

message AnalyzeJobPB {
  enum Kind {
    UNSPECIFIED = 0;
    NATIVE = 1;
    EXTERNAL = 2;
  }
  Kind kind = 1;
  AnalyzeJobCorePB core = 2;
  oneof instance {
    NativeAnalyzeJobPB native = 11;
    ExternalAnalyzeJobPB external = 12;
  }
}

message AnalyzeStatusCorePB {
  optional int64 id = 1;
  StringListPB columns = 2;
  optional AnalyzeTypePB type = 3;
  optional AnalyzeScheduleTypePB schedule_type = 4;
  StringMapPB properties = 5;
  optional AnalyzeScheduleStatusPB status = 6;
  optional int64 start_time = 7;
  optional int64 end_time = 8;
  optional string reason = 9;
  optional int64 progress = 10;
}

message NativeAnalyzeStatusPB {
  optional int64 db_id = 1;
  optional int64 table_id = 2;
}

message ExternalAnalyzeStatusPB {
  optional string catalog_name = 1;
  optional string db_name = 2;
  optional string table_name = 3;
  optional string table_uuid = 4;
}

message AnalyzeStatusPB {
  enum Kind {
    UNSPECIFIED = 0;
    NATIVE = 1;
    EXTERNAL = 2;
  }
  Kind kind = 1;
  AnalyzeStatusCorePB core = 2;
  oneof instance {
    NativeAnalyzeStatusPB native = 11;
    ExternalAnalyzeStatusPB external = 12;
  }
}

message ColumnStatsMetaPB {
  optional string column_name = 1;
  optional AnalyzeTypePB type = 2;
  optional int64 update_time = 3;
  Int64ListPB sampled_partitions_hash_value = 4;
  optional int32 all_partition_size = 5;
  int32 requested_partition_count = 6;
}

message BasicStatsMetaPB {
  optional int64 db_id = 1;
  optional int64 table_id = 2;
  StringListPB columns = 3;
  optional AnalyzeTypePB type = 4;
  optional int64 update_time = 5;
  StringMapPB properties = 6;
  optional int64 total_rows = 7;
  optional int64 delta_rows = 8;
  ColumnStatsMetaMapPB column_stats_meta_map = 9;
  optional int64 tablet_stats_report_time = 10;
}

message HistogramStatsMetaPB {
  optional int64 db_id = 1;
  optional int64 table_id = 2;
  optional string column = 3;
  optional AnalyzeTypePB type = 4;
  optional int64 update_time = 5;
  StringMapPB properties = 6;
}

message ExternalBasicStatsMetaPB {
  optional string catalog_name = 1;
  optional string db_name = 2;
  optional string table_name = 3;
  StringListPB columns = 4;
  optional AnalyzeTypePB type = 5;
  optional int64 update_time = 6;
  StringMapPB properties = 7;
  ColumnStatsMetaMapPB column_stats_meta_map = 8;
  optional string table_uuid = 9;
}

message ExternalHistogramStatsMetaPB {
  optional string catalog_name = 1;
  optional string db_name = 2;
  optional string table_name = 3;
  optional string column = 4;
  optional AnalyzeTypePB type = 5;
  optional int64 update_time = 6;
  StringMapPB properties = 7;
  optional string table_uuid = 8;
}

message MultiColumnStatsMetaPB {
  optional int64 db_id = 1;
  optional int64 table_id = 2;
  Int32ListPB column_ids = 3;
  optional AnalyzeTypePB analyze_type = 4;
  StatisticsTypeListPB statistics_types = 5;
  optional int64 update_time = 6;
  StringMapPB properties = 7;
}

message AnalyzeMgrPB {}
