syntax = "proto3";

package starrocks.persist;

option java_package = "com.starrocks.persist.proto";
option java_multiple_files = true;
option java_outer_classname = "SmallFileMgrProto";

message SmallFileMgrPB {}

message SmallFilePB {
  optional int64 db_id = 1;
  optional string catalog = 2;
  optional string name = 3;
  optional int64 id = 4;
  // Preserve the v2 representation: base64 content when is_content is true, otherwise a URL.
  optional string content = 5;
  optional int64 size = 6;
  optional string md5 = 7;
  optional bool is_content = 8;
}
