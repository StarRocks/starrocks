syntax = "proto3";

package starrocks.persist;

option java_package = "com.starrocks.persist.proto";
option java_multiple_files = true;
option java_outer_classname = "ClusterSnapshotProto";

message ClusterSnapshotMgrPB {
  optional string storage_volume_name = 1;
  int64 automated_snapshot_interval_seconds = 2;
}

message ClusterSnapshotPB {
  enum ClusterSnapshotType {
    UNSPECIFIED = 0;
    AUTOMATED = 1;
    MANUAL = 2;
    INCREMENTAL = 3;
  }
  int64 id = 1;
  optional string snapshot_name = 2;
  optional ClusterSnapshotType type = 3;
  optional string storage_volume_name = 4;
  int64 created_time_ms = 5;
  int64 finished_time_ms = 6;
  int64 fe_journal_id = 7;
  int64 star_mgr_journal_id = 8;
}

message ClusterSnapshotJobPB {
  enum ClusterSnapshotJobState {
    UNSPECIFIED = 0;
    INITIALIZING = 1;
    SNAPSHOTING = 2;
    UPLOADING = 3;
    FINISHED = 4;
    EXPIRED = 5;
    DELETED = 6;
    ERROR = 7;
  }
  ClusterSnapshotPB snapshot = 1;
  optional ClusterSnapshotJobState state = 2;
  optional string err_msg = 3;
  optional string detail_info = 4;
}
