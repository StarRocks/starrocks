syntax = "proto3";

package starrocks.persist;

import "persist/common.proto";

option java_package = "com.starrocks.persist.proto";
option java_multiple_files = true;
option java_outer_classname = "DeleteMgrProto";

message DeleteMgrPB {}

message MultiDeleteInfoPB {
  optional int64 db_id = 1;
  optional int64 table_id = 2;
  optional string table_name = 3;
  StringListPB delete_conditions = 4;
  optional int64 create_time_ms = 5;
  Int64ListPB partition_ids = 6;
  StringListPB partition_names = 7;
  optional bool no_partition_specified = 8;
}
