syntax = "proto3";

package starrocks.persist;

option java_package = "com.starrocks.persist.proto";
option java_multiple_files = true;
option java_outer_classname = "MaterializedViewMgrProto";

// Compatibility metadata for legacy incremental MV maintenance jobs.
message MVMaintenanceJobPB {
  enum State {
    UNSPECIFIED = 0;
    INIT = 1;
    STARTED = 2;
    PREPARING = 3;
    PAUSED = 4;
    RUN_EPOCH = 5;
    STOPPED = 6;
    FAILED = 7;
  }
  int64 job_id = 1;
  int64 db_id = 2;
  int64 view_id = 3;
  optional State state = 4;
  MVEpochPB epoch = 5;
}

message MVEpochPB {
  enum State {
    UNSPECIFIED = 0;
    INIT = 1;
    READY = 2;
    RUNNING = 3;
    COMMITTING = 4;
    COMMITTED = 5;
    FAILED = 6;
  }
  int64 db_id = 1;
  int64 mv_id = 2;
  optional State state = 3;
  BinlogConsumeStatePB binlog_state = 4;
  int64 start_time_milli = 5;
  int64 commit_time_milli = 6;
}

message BinlogConsumeStatePB {
  BinlogOffsetMapPB offsets = 1;
}

message BinlogOffsetMapPB {
  map<int64, BinlogOffsetPB> values = 1;
}

message BinlogOffsetPB {
  int64 version = 1;
  int64 lsn = 2;
}
