syntax = "proto3";

package starrocks.persist;

import "persist/common.proto";

option java_package = "com.starrocks.persist.proto";
option java_multiple_files = true;
option java_outer_classname = "DictionaryMgrProto";

message DictionaryMgrPB {
  int64 next_txn_id = 1;
  int64 next_dictionary_id = 2;
}

message DictionaryNamePB {
  string name = 1;
  int64 dictionary_id = 2;
}

message DictionaryPB {
  enum State {
    UNSPECIFIED = 0;
    UNINITIALIZED = 1;
    REFRESHING = 2;
    COMMITTING = 3;
    FINISHED = 4;
    CANCELLED = 5;
  }
  int64 dictionary_id = 1;
  optional string dictionary_name = 2;
  optional string catalog_name = 3;
  optional string db_name = 4;
  optional string queryable_object = 5;
  StringListPB dictionary_keys = 6;
  StringListPB dictionary_values = 7;
  optional int64 next_schedulable_time = 8;
  int64 last_success_refresh_time = 9;
  int64 last_success_finished_time = 10;
  optional State state = 11;
  optional State state_before_refresh = 12;
  optional string runtime_err_msg = 13;
  int64 last_success_version = 14;
  optional int64 memory_limit = 15;
  int32 refresh_interval = 16;
  bool read_latest = 17;
  bool ignore_failed_refresh = 18;
}
