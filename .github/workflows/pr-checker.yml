name: PR CHECKER

on:
  pull_request_target:
    branches:
      - main
      - "branch*"

    types:
      - opened
      - reopened
      - edited
      - synchronize

concurrency:
  group: PR-CHECKER-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  checks: write
  actions: write
  contents: write
  deployments: write
  discussions: write
  issues: write
  packages: write
  pages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

jobs:
  sync-checker:
    runs-on: ubuntu-latest
    if: >
      !contains(github.event.pull_request.title, '(sync #') &&
      !contains(github.event.pull_request.labels.*.name, 'sync') &&
      (!startsWith(github.head_ref, github.base_ref) || !contains(github.head_ref, '-sync-'))
    name: SYNC CHECKER
    outputs:
      BACKPORT_SOURCE_PR: ${{ steps.backport_source.outputs.ORI_PR }}
    steps:
      - run: echo "Normal PR."

      - name: backport source
        id: backport_source
        if: startsWith(github.head_ref, 'mergify/bp/') && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          ORI_PR=$(echo "${PR_TITLE}" | grep -oP '\(backport #\K\d+' | tail -n 1)
          author=$(gh pr view ${ORI_PR} -R ${REPO} --json author -q '.author.login')
          if [[ ! "${author}" =~ "mergify" ]]; then
            echo "ORI_PR=${ORI_PR}" >> $GITHUB_OUTPUT
          fi

  # Assign the backport to the owner of its main PR. The owner is not always the
  # author (CD->SR sync PRs are opened by a bot), so the logic is in ci-tool.
  backport-assign:
    needs: sync-checker
    if: needs.sync-checker.outputs.BACKPORT_SOURCE_PR != ''
    runs-on: [self-hosted, quick]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.number }}
      SOURCE_PR: ${{ needs.sync-checker.outputs.BACKPORT_SOURCE_PR }}
    steps:
      - name: backport assign
        run: |
          rm -rf ./ci-tool && cp -rf /var/lib/ci-tool ./ci-tool && cd ci-tool && (git pull || true)
          python3 lib/backport_assign.py

  title-check:
    runs-on: ubuntu-latest
    needs: sync-checker
    if: >
      !startsWith(github.event.pull_request.title, 'Revert ')
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.number }}
      REPO: ${{ github.repository }}
      BACKPORT_SOURCE_PR: ${{ needs.sync-checker.outputs.BACKPORT_SOURCE_PR }}
    steps:
      - uses: thehanimo/pr-title-checker@v1.3.5
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          pass_on_octokit_error: false
          configuration_path: ".github/pr-title-checker-config.json"

      - name: update body
        if: always() && github.base_ref != 'main' && (github.event.action == 'opened' || github.event.action == 'reopened')
        env:
          # MUST stay a PAT: this step edits the PR body to check "[x] This is a
          # backport pr", and the edit must emit an `edited` event that re-triggers
          # this workflow so `check backport pr's title` runs on the updated body.
          # GITHUB_TOKEN edits do not trigger workflows, which would silently skip
          # the backport-title check.
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh pr view ${PR_NUMBER} -R ${REPO} --json body -q .body > body.txt
          ori_body=$(cat body.txt)

          if [[ "${GITHUB_HEAD_REF}" == "mergify/bp/"* && "${BACKPORT_SOURCE_PR}" != "" ]]; then
            gh pr view ${BACKPORT_SOURCE_PR} -R ${REPO} --json body -q .body > source_body.txt
            if grep -q 'Bugfix cherry-pick branch check'; then
              sed -ie '/Bugfix cherry-pick branch check/,$d' source_body.txt
              cat source_body.txt > tmp_body.txt
              mv tmp_body.txt body.txt
            fi
          fi

          sed -i "s#\[ \] This is a backport pr#\[x\] This is a backport pr#g" body.txt
          if [[ "${ori_body}" != $(cat body.txt) ]]; then
            gh pr edit ${PR_NUMBER} -R ${REPO} -F body.txt
          fi

      - name: check backport pr's title
        if: github.base_ref != 'main' && contains(toJson(github.event.pull_request.body), '[x] This is a backport pr')
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          count=$(echo "${PR_TITLE}" | grep -E '\(backport #[0-9]+)$' | wc -l)
          if [[ $count -le 0 ]]; then
            echo "::error::Backport PR title is not valid. It should end with '(backport #[0-9]+)'"
            exit 1
          fi

      - name: check backport option
        if: >
          github.base_ref != 'main' && github.event.action != 'opened' &&
          !contains(toJson(github.event.pull_request.body), '[x] This is a backport pr') &&
          !contains(toJson(github.event.pull_request.body), '[ ] This is a backport pr')

        run: |
          echo "::error::Branch PR does not contain the backport option!"
          exit 1

  # The backport versions come from the branch map (ci-tool conf/sync_branch_map.json:
  # `versions --repo sr`, the StarRocks branches paired with CelerData), so a
  # new or retired release branch needs no workflow edit. The static list is the fallback when
  # the map cannot be read.
  backport-versions:
    runs-on: [ self-hosted, quick ]
    outputs:
      versions: ${{ steps.map.outputs.versions || '["4.2", "4.1", "4.0"]' }}
    steps:
      - name: read the backport versions
        id: map
        continue-on-error: true
        run: |
          rm -rf ./ci-tool && cp -rf /var/lib/ci-tool ./ci-tool && cd ci-tool && (git pull -q || true)
          echo "versions=$(python3 lib/sync_branch_map.py versions --repo sr)" >> "$GITHUB_OUTPUT"

  backport-check-subtask:
    needs: [ title-check, backport-versions ]
    runs-on: ubuntu-latest
    if: >
      (
        startsWith(github.event.pull_request.title, '[BugFix]') ||
        startsWith(github.event.pull_request.title, '[Enhancement]') ||
        startsWith(github.event.pull_request.title, '[Doc]') ||
        startsWith(github.event.pull_request.title, '[UT]')
      ) && !contains(github.event.pull_request.title, 'cherry-pick') && !contains(github.event.pull_request.title, 'backport')
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.backport-versions.outputs.versions) }}
    steps:
      # Only main PRs are compared: the release-branch templates keep stale version lists. PRs
      # synced in from CelerData or Mirrorship (bot branches *-contributed-pr-* in this repo)
      # carry the source repo's section.
      - name: Check backport section lists the template versions
        if: >-
          github.base_ref == 'main' &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.head_ref, '-contributed-pr-'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import subprocess
          from urllib.parse import quote

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              pr = json.load(event_file)["pull_request"]
          endpoint = "repos/{}/contents/.github/PULL_REQUEST_TEMPLATE.md?ref={}".format(
              os.environ["GITHUB_REPOSITORY"], quote(pr["base"]["ref"], safe=""))
          template = subprocess.check_output(
              ["gh", "api", endpoint, "-H", "Accept: application/vnd.github.raw+json"], text=True)

          def section_rows(text):
              """The checkbox rows of the one Bugfix cherry-pick branch check section: the
              versions listed as the label steps read them ("[x] 4.0" / "[ ] 4.0"), and the
              other rows as (text, ticked). Other lines in the section are not read."""
              lines = (text or "").splitlines()
              starts = [i for i, line in enumerate(lines)
                        if re.match(r"^##\s*Bugfix cherry-pick branch check", line)]
              if len(starts) != 1:
                  raise ValueError("Expected exactly one Bugfix cherry-pick branch check section.")
              start = starts[0]
              end = next((i for i in range(start + 1, len(lines))
                          if re.match(r"^#{1,2}\s", lines[i])), len(lines))
              versions, others = set(), []
              for line in lines[start + 1:end]:
                  box = re.match(r"^\s*- \[([ xX])\]\s+(.*?)\s*$", line)
                  if not box:
                      continue
                  version = re.fullmatch(r"\s*- \[[ xX]\] (\d+\.\d+(?:\.\d+)?)", line.rstrip())
                  if version:
                      versions.add(version.group(1))
                  elif not re.fullmatch(r"\d+\.\d+(?:\.\d+)?", box.group(2)):
                      others.append((box.group(2), box.group(1) != " "))
              return versions, others

          # Every version row of the base branch template must be listed (ticked or not), and the
          # acknowledgement -- the first other checkbox row, its wording not compared -- ticked.
          # Extra rows are ignored.
          expected = []
          try:
              template_versions, template_others = section_rows(template)
              expected = sorted(template_versions, key=lambda v: [int(n) for n in v.split(".")], reverse=True)
              if not expected or not template_others:
                  raise ValueError("The base branch PR template has an invalid backport section.")
              versions, others = section_rows(pr.get("body"))
              missing = [version for version in expected if version not in versions]
              problems = []
              if not others:
                  problems.append("the acknowledgement checkbox row is missing")
              elif not others[0][1]:
                  problems.append("the acknowledgement checkbox row is not ticked")
              if missing:
                  problems.append("version rows missing: " + ", ".join(missing))
              if problems:
                  raise ValueError("Backport section: {}.".format("; ".join(problems)))
          except ValueError as error:
              print("::error::{} The section must list every version of the PR base branch's "
                    ".github/PULL_REQUEST_TEMPLATE.md ({}) as \"- [ ] <version>\"; tick the ones "
                    "to backport.".format(error, ", ".join(expected) or "see the template"))
              raise SystemExit(1)
          PYTHON

      - name: add ${{ matrix.version }} label
        if: contains(toJson(github.event.pull_request.body), format('[x] {0}', matrix.version))
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: ${{ matrix.version }}

      - name: remove ${{ matrix.version }} label
        if: contains(toJson(github.event.pull_request.body), format('[ ] {0}', matrix.version)) && contains(github.event.pull_request.labels.*.name, matrix.version)
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          labels: ${{ matrix.version }}

      - name: check-done
        if: contains(toJson(github.event.pull_request.body), '[ ] I have checked the version labels')
        run: |
          echo "::error::You must mark this checkbox - I have checked the version labels which the pr will be auto-backported to the target branch"
          exit 1

  backport-check:
    runs-on: ubuntu-latest
    needs: backport-check-subtask
    if: always() && needs.backport-check-subtask.result != 'skipped'
    steps:
      - name: Check subtask status
        if: needs.backport-check-subtask.result == 'failure'
        run: |
          exit 1

  behavior-check:
    runs-on: ubuntu-latest
    if: >
      !startsWith(github.event.pull_request.title, '[Doc]') &&
      !startsWith(github.event.pull_request.title, 'Revert ') &&
      (github.base_ref == 'main' || !startsWith(github.head_ref, 'mergify/bp/') || github.event.action != 'opened')
    steps:
      - name: Format Check
        id: check
        if: >
          (!contains(toJson(github.event.pull_request.body), '[ ] Yes, this PR will result in a change in behavior') &&
          !contains(toJson(github.event.pull_request.body), '[x] Yes, this PR will result in a change in behavior')) ||
          (!contains(toJson(github.event.pull_request.body), '[ ] No, this PR will not result in a change in behavior') &&
          !contains(toJson(github.event.pull_request.body), '[x] No, this PR will not result in a change in behavior')) ||
          (contains(toJson(github.event.pull_request.body), '[x] Yes, this PR will result in a change in behavior') &&
          contains(toJson(github.event.pull_request.body), '[x] No, this PR will not result in a change in behavior')) ||
          (contains(toJson(github.event.pull_request.body), '[ ] Yes, this PR will result in a change in behavior') &&
          contains(toJson(github.event.pull_request.body), '[ ] No, this PR will not result in a change in behavior'))
        run: |
          echo "::error::Please check the format of your pr body about the behavior change checkbox!"
          exit 1

      - name: Behavior Unchanged Label
        id: unchanged
        if: >
          steps.check.outcome == 'skipped' &&
          contains(toJson(github.event.pull_request.body), '[x] No, this PR will not result in a change in behavior')
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          labels: "behavior_changed"

      - name: Behavior Changed Check
        id: changed_check
        if: >
          always() && steps.check.outcome == 'skipped' && steps.unchanged.outcome == 'skipped' &&
          contains(toJson(github.event.pull_request.body), '[x] Yes, this PR will result in a change in behavior') &&
          contains(toJson(github.event.pull_request.body), '[ ] Interface/UI changes: syntax, type conversion, expression evaluation, display information') &&
          contains(toJson(github.event.pull_request.body), '[ ] Parameter changes: default values, similar parameters but with different default values') &&
          contains(toJson(github.event.pull_request.body), '[ ] Policy changes: use new policy to replace old one, functionality automatically enabled') &&
          contains(toJson(github.event.pull_request.body), '[ ] Feature removed') &&
          contains(toJson(github.event.pull_request.body), '[ ] Miscellaneous: upgrade & downgrade compatibility, etc')
        run: |
          echo "::error::You must specify the type of change!"
          exit 1

      - name: Behavior Changed Label
        if: >
          always() &&
          steps.check.outcome == 'skipped' &&
          steps.unchanged.outcome == 'skipped' &&
          steps.changed_check.outcome != 'failure'
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: "behavior_changed"

  automerge-check:
    runs-on: ubuntu-latest
    needs: backport-check
    if: >
      !failure() &&
      github.base_ref != 'main' &&
      startsWith(github.head_ref, 'mergify/') &&
      (contains(github.event.pull_request.title, 'cherry-pick') || 
      contains(github.event.pull_request.title, 'backport'))
    steps:
      - name: add automerge label
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: automerge

      - name: automerge
        uses: peter-evans/enable-pull-request-automerge@v2
        with:
          token: ${{ secrets.PAT }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash

  changelist-check:
    runs-on: [self-hosted, normal]
    if: >
      (github.event.action == 'opened' || github.event.action == 'synchronize') &&
      !contains(github.event.pull_request.title, 'cherry-pick') &&
      !contains(github.event.pull_request.title, 'backport')
    env:
      PR_NUMBER: ${{ github.event.number }}
      GH_TOKEN: ${{ secrets.PAT }}
    steps:
      - name: CHECK CHANGELIST
        run: |
          rm -rf ./ci-tool && cp -rf /var/lib/ci-tool ./ci-tool && cd ci-tool && git pull && source lib/init.sh
          ./bin/check-pr-changelist.sh


  conflict-marker-check:
    # Deliberately NOT exempted for backport / cherry-pick PRs the way changelist-check
    # is: an automated backport that hits a conflict and commits its own markers is
    # exactly the case this gate exists for.
    runs-on: [self-hosted, quick]
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.number }}
      GH_TOKEN: ${{ secrets.PAT }}
    steps:
      - name: Check Conflict Markers
        run: |
          rm -rf ./ci-tool && cp -rf /var/lib/ci-tool ./ci-tool && cd ci-tool && (git pull || true)
          python3 scripts/check-conflict-markers.py
