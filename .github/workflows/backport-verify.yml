name: BACKPORT VERIFY

# Divergence gate: compare the AI-recommended backport set (from the advisory comment's
# <!-- backport-affected-json --> marker) against the author's ticked version boxes.
#   equal        -> success (no author action)
#   AI absent    -> success (fail-open)
#   differ+acked -> success
#   differ       -> failure  (author re-ticks OR posts the exact confirmation line)
# The `backport-verify` commit status is the gate; it replaces the static "confirm the AI
# backport recommendation" checkbox.
#
# THIN CALLER: all logic lives in ci-tool/lib/backport_verify_run.py (resolve the PR, scope
# it, read the advisory AI set + the author's ticks, decide, post the status + sticky
# comments). `backport-verify` is a required status on main and the runner ALWAYS posts on
# base==main (success "not applicable" for non-backportable / mergify-bp PRs), so a required
# context never leaves a PR pending.

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
  issue_comment:
    # `edited` too: a reopened / title-edited PR makes ai-backport-advisory.yml EDIT its
    # sticky advisory comment (new AI set) rather than create a new one; without `edited`
    # the gate would keep evaluating the stale marker.
    types: [created, edited]

permissions:
  contents: read
  statuses: write
  pull-requests: write
  issues: write

concurrency:
  group: backport-verify-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  verify:
    # Only PRs (an issue_comment must be on a PR). For issue_comment (created OR edited), only
    # the comments that can change the decision are worth a run: the advisory (carries the
    # <!-- backport-affected-json --> marker) or the author's exact confirmation line — and
    # exclude the gate's OWN sticky comments (the block comment embeds the confirmation line as
    # copy-paste text, so filter out anything carrying a `<!-- backport-verify` marker). Bot
    # coverage reports / chatter cannot change pass/block, so they never start a run.
    if: >
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (contains(github.event.comment.body, 'backport-affected-json') ||
         (contains(github.event.comment.body, 'I have confirmed the differences between the Backport branch and the AI recommendations') &&
          !contains(github.event.comment.body, '<!-- backport-verify'))))
    runs-on: [self-hosted, quick]
    env:
      GH_TOKEN: ${{ secrets.PAT }}
      GITHUB_TOKEN: ${{ secrets.PAT }}
      # Untrusted comment payload via env (NEVER a shell arg); the runner reads $EV_BODY.
      # Empty for pull_request_target.
      EV_USER: ${{ github.event.comment.user.login }}
      EV_BODY: ${{ github.event.comment.body }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: backport-verify gate
        run: |
          set -euo pipefail
          rm -rf ./ci-tool && cp -rf /var/lib/ci-tool ./ci-tool
          ( cd ci-tool && git pull -q || true )
          python3 ci-tool/lib/backport_verify_run.py \
            --repo "${{ github.repository }}" --pr "${PR_NUMBER}" \
            --event-name "${{ github.event_name }}" --event-user "${EV_USER:-}"
