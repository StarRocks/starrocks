name: INSPECTION TRIAGE

# On-demand SQL-Tester blacklist regression on the native Ubuntu CI box
# (runner labels [self-hosted, ubuntu, ai]). A faithful minimal copy of
# weekly-unstable-case-review.yml's sql-tester-review job:
#   apply ci-admit cluster -> deploy latest inspection build -> run blacklist
#   (3 rounds) -> backup logs -> clean MySQL ECI -> DELETE cluster (always).
# No keep-alive, no session state; the cluster never outlives the job.
#
# Differences from weekly-review (deliberate, minimal):
#   1. runs-on [self-hosted, ubuntu, ai] (native box, not the docker runners).
#   2. run.py runs under the sr-ci-py39 virtualenv (python 3.9.19).
#   3. Package bucket/prefix selected by repository owner — weekly-review
#      hardcodes starrocks-ci-release/StarRocks-*, which is wrong in this repo.
#   4. Source tree is reset to the deployed build's commit so T/R files match
#      the binaries.
# It does NOT run weekly-review's report job: never writes unstable_case.json,
# never opens PRs, never pings Slack. AI triage will be added in a follow-up.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to reproduce (default: main)'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read
  actions: read

env:
  IS_INSPECTION: 'true'
  SHARE_PATH: /var/local/env

jobs:
  sql-tester-review:
    name: SQL-TESTER REVIEW
    runs-on: [self-hosted, ubuntu, ai]
    env:
      BRANCH:        ${{ inputs.branch }}
      WEEKLY_REVIEW: 'true'
      LINUX_DISTRO:  ubuntu
      BUILD_TYPE:    Release
    steps:
      - name: Clean Workspace
        run: git -C ${{ github.workspace }} clean -ffdxq 2>/dev/null || { rm -rf ${{ github.workspace }}; mkdir -p ${{ github.workspace }}; }

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply for ECS & Deploy SR
        id: deploy
        timeout-minutes: 40
        run: |
          set -eo pipefail
          rm -rf ./ci-tool && cp -rf /var/lib/ci-tool ./ci-tool && cd ci-tool && git pull >/dev/null && source lib/init.sh

          # Locate the latest inspection build for this branch. Bucket and tar
          # prefix depend on the repo owner (weekly-review wrongly hardcodes the
          # StarRocks ones in this repo).
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [[ "${owner}" == "starrocks" ]]; then
            _bucket="starrocks-ci-release"; _prefix="StarRocks"
          else
            _bucket="${owner}-ci-release";  _prefix="CelerData"
          fi
          _oss="/var/local/env/ossutil64 --config-file /root/.ossutilconfig"
          _base="oss://${_bucket}/${BRANCH}/Release/inspection/pr/ubuntu"
          LATEST_SHA=$(${_oss} ls "${_base}/" | grep "\-BE\.tar\.gz" | sort -r | head -1 | awk '{print $NF}' | grep -oE '[a-f0-9]{40}')
          [[ -z "${LATEST_SHA}" ]] && echo "::error::No inspection package found for branch ${BRANCH}" && exit 1
          SHORT_SHA=${LATEST_SHA:0:7}
          echo "Inspection commit: ${LATEST_SHA}"
          echo "PR_NUMBER=${LATEST_SHA}" >> $GITHUB_ENV

          # Align source (T/R files) with the deployed binaries' commit.
          git -C "${GITHUB_WORKSPACE}" checkout -q "${LATEST_SHA}" || \
            echo "::warning::could not checkout ${LATEST_SHA}; staying on ${BRANCH} HEAD"

          ./bin/elastic-cluster.sh --template ci-admit --linuxdistro ubuntu

          export BE_OUTPUT_TAR="${_base}/${LATEST_SHA}/be/${_prefix}-${SHORT_SHA}-BE.tar.gz"
          export FE_OUTPUT_TAR="${_base}/${LATEST_SHA}/fe/${_prefix}-${SHORT_SHA}-FE.tar.gz"
          export LINUX_DISTRO=ubuntu PR_NUMBER=${LATEST_SHA}
          ./bin/deploy-cluster.sh -c ci-admit

      - name: Run SQL-Tester (blacklist only, 3 rounds)
        id: run
        if: steps.deploy.outcome == 'success'
        timeout-minutes: 360
        env:
          FE_NODE:      ${{ steps.deploy.outputs.fe }}
          BE_NODE:      ${{ steps.deploy.outputs.be }}
          CLUSTER_NAME: ci-admit
        run: |
          set -eo pipefail
          # run.py needs python 3.9; both envs are managed by virtualenvwrapper.
          # run-sql-tester's `pyenv local 3.9` no-ops here (pyenv not on PATH)
          # and the active venv's 3.9.19 is used instead.
          source /home/disk1/.virtualenvs/sr-ci-py39/bin/activate
          python3 --version
          cd ci-tool && source lib/init.sh

          # Result OSS path (same layout run-sql-tester uses in inspection mode)
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SQL_OSS="oss://${owner}-ci-release/inspection/${PR_NUMBER}/sql-tester/Release/ubuntu/native"
          echo "sql_oss_path=${SQL_OSS}" >> $GITHUB_OUTPUT

          ./bin/run-sql-tester.sh

      - name: Backup logs
        if: always()
        run: |
          cd ci-tool && source lib/init.sh
          ./bin/backup_log_cores.sh || true

      - name: Clean MySQL ECI
        if: always() && steps.run.outputs.MYSQL_ECI_ID != ''
        run: eci rm ${{ steps.run.outputs.MYSQL_ECI_ID }} || true

      - name: Delete ECS cluster
        if: always()
        run: |
          cd ci-tool && source lib/init.sh
          ./bin/elastic-cluster.sh --delete || true

      - name: Clean ENV
        if: always()
        run: git -C ${{ github.workspace }} clean -ffdxq 2>/dev/null || rm -rf ${{ github.workspace }}/*
