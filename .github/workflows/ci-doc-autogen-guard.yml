name: CI Doc Autogen Guard

# Fails when the generated sections of the SQL function reference do not match
# the function_docs payload in gensrc/script/functions.py -- either because a
# doc page was edited by hand inside an AUTOGENERATED region, or because the
# payload changed and the generator was never re-run.
#
# Unlike ci-doc-param-drift.yml this uses `pull_request`, not
# `pull_request_target`: the check only reads the tree and sets an exit code,
# so it needs no write-scoped token and can safely run the PR's own code.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - 'branch*'
    paths:
      - 'gensrc/script/functions.py'
      - 'gensrc/script/gen_function_docs.py'
      - 'docs/scripts/check_autogenerated_regions.py'
      - 'docs/en/sql-reference/sql-functions/**'
      - 'docs/zh/sql-reference/sql-functions/**'
      - 'docs/ja/sql-reference/sql-functions/**'

permissions:
  contents: read

jobs:
  autogen-guard:
    runs-on: ubuntu-latest
    name: Check generated function docs are current

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check generated regions match the payload
        run: |
          python3 docs/scripts/check_autogenerated_regions.py \
            --base-ref "origin/${{ github.base_ref }}"

      - name: Run generator unit tests
        run: python3 -m unittest discover -s gensrc/script -p 'test_gen_function_docs.py' -v

      - name: Report translation gaps
        # Advisory only: never fails the build.
        if: always()
        run: |
          python3 gensrc/script/gen_function_docs.py --check --notes 2>&1 \
            | grep '^NOTE:' || echo "No translation gaps reported."
