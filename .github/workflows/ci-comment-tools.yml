name: CI COMMENT TOOLS

on:
  issue_comment:
    types: [ created ]

jobs:

  close:
    name: CLOSE PR
    runs-on: ubuntu-latest
    if: >
      contains(github.event.issue.pull_request.html_url, 'pull') &&
      (contains(github.event.comment.body, '@Mergify close') ||
      contains(github.event.comment.body, '@Mergifyio close'))

    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      GITHUB_TOKEN: ${{ secrets.PAT }}
      COMMENTER: ${{ github.event.comment.user.login }}
      ORG: ${{ github.repository_owner }}

    steps:
      # Runs with secrets.PAT, so only org members can trigger it (see AutoMerge below).
      - name: CLOSE
        run: |
          if ! gh api "orgs/${ORG}/members/${COMMENTER}" --silent; then
            echo "::error::${COMMENTER} is not a member of ${ORG}; not closing."
            exit 1
          fi
          gh pr close ${PR_NUMBER} -R ${{ github.repository }} -c "PR was manually closed."

  automerge:
    name: AutoMerge PR
    runs-on: ubuntu-latest
    if: >
      contains(github.event.issue.pull_request.html_url, 'pull') &&
      contains(github.event.comment.body, '@Mergify automerge')

    env:
      PR_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: BASE REF
        id: get_base_ref
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base_ref=$(gh pr view ${PR_NUMBER} -R ${{ github.repository }} --json baseRefName | jq -r '.baseRefName')
          echo "base_ref=${base_ref}" >> $GITHUB_OUTPUT

      # Conflict-fix PRs into a Mergify backport branch (mergify/bp/...) or into the head
      # branch of a contributed sync PR (main-cd-contributed-pr-N, main-ms-contributed-pr-N).
      # The merge runs with secrets.PAT, so only org members can trigger it. Membership is
      # checked with the PAT: author_association reads CONTRIBUTOR for private members.
      - name: AutoMerge
        if: >
          startsWith(steps.get_base_ref.outputs.base_ref, 'mergify/bp/') ||
          contains(steps.get_base_ref.outputs.base_ref, '-contributed-pr-')
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          COMMENTER: ${{ github.event.comment.user.login }}
          ORG: ${{ github.repository_owner }}
        run: |
          if ! gh api "orgs/${ORG}/members/${COMMENTER}" --silent; then
            echo "::error::${COMMENTER} is not a member of ${ORG}; not merging."
            exit 1
          fi
          gh pr merge ${PR_NUMBER} -R ${{ github.repository }} -s --auto

  rerun:
    name: Rerun
    runs-on: ubuntu-latest
    if: >
      contains(github.event.issue.pull_request.html_url, 'pull') &&
      contains(github.event.comment.body, 'Re-run the workflow')
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      GITHUB_TOKEN: ${{ secrets.PAT }}
      ROBOT_SERVER: ${{ secrets.ROBOT_URL }}

    steps:
      - name: CLOSE
        run: |
          ret=$(curl -sX POST -H "Content-Type: application/json" \
            -d "{\"repository\":\"${GITHUB_REPOSITORY}\", \"pr_id\":\"${PR_NUMBER}\"}" ${ROBOT_SERVER})
          ret_code=$(echo "${ret}" | jq -r '.result')
          if [[ '${ret_code}' == "false" ]]; then
            echo "Re-run failed!"
            exit 1
          fi
