name: CI COMMENT TOOLS

on:
  issue_comment:
    types: [ created ]

permissions:
  checks: write
  actions: write
  contents: write
  deployments: write
  discussions: write
  issues: write
  packages: write
  pages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

jobs:

  info:
    name: INFO
    runs-on: [self-hosted, sync-normal]
    if: >
      contains(github.event.issue.html_url, '/pull/') &&
      !contains(github.event.comment.body, 'BACKPORT to') &&
      !contains(github.event.comment.body, 'BACKPORT ERROR') &&
      (contains(github.event.comment.body, '@Mergify rebase') ||
      contains(github.event.comment.body, '@Mergifyio rebase') ||
      contains(github.event.comment.body, '@Mergify backport') ||
      contains(github.event.comment.body, '@Mergifyio backport') ||
      contains(github.event.comment.body, '@Mergify automerge') ||
      contains(github.event.comment.body, '@Mergifyio automerge'))

    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      SYNC_PAT: ${{ secrets.SYNC_PAT }}
    outputs:
      assignees: ${{ steps.pr-info.outputs.assignees }}
      branch: ${{ steps.pr-info.outputs.branch }}
      state: ${{ steps.pr-info.outputs.state }}
      merge_commit: ${{ steps.pr-info.outputs.merge_commit }}
      title: ${{ steps.pr-info.outputs.title }}
    steps:
      - name: PR INFO
        id: pr-info
        run: |
          cd /var/lib/elastic-service && ./lib/get_pr_info.sh

  rebase:
    name: Rebase
    runs-on: [self-hosted, light]
    needs: info
    if: >
      contains(github.event.comment.body, '@Mergify rebase') ||
      contains(github.event.comment.body, '@Mergifyio rebase')
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      BRANCH: ${{ needs.info.outputs.branch }}
      ASSIGNEES: ${{ needs.info.outputs.assignees }}
      GH_TOKEN: ${{ secrets.PAT }}
      GITHUB_TOKEN: ${{ secrets.PAT }}
    steps:
      # GitHub server-side rebase (native `updatePullRequestBranch updateMethod: REBASE`).
      # No checkout / no workspace / no GITHUB_EVENT_PATH, so it is immune to the self-hosted
      # runner temp-dir race that broke cirrus-actions/rebase@1.8 (event.json vanished mid-job
      # because a concurrent job on the shared [self-hosted, light] runner wiped _github_workflow).
      # Works for same-repo branch PRs (backport / sync), which is what `@Mergifyio rebase` targets here.
      # (autosquash is intentionally not supported: the API cannot express it, and it has never
      # been used here — the only historical `autosquash` comment was a 2023 pipeline test.)
      - name: Rebase PR onto base (server-side)
        run: |
          set -euo pipefail
          OWNER=${GITHUB_REPOSITORY%/*}; REPO=${GITHUB_REPOSITORY#*/}
          PR_ID=$(gh api graphql \
            -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){id}}}' \
            -F o="$OWNER" -F r="$REPO" -F n="$PR_NUMBER" --jq '.data.repository.pullRequest.id')
          echo "PR #$PR_NUMBER node id: $PR_ID"
          set +e
          out=$(gh api graphql \
            -f query='mutation($id:ID!){updatePullRequestBranch(input:{pullRequestId:$id,updateMethod:REBASE}){pullRequest{number}}}' \
            -F id="$PR_ID" 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ $rc -ne 0 ]; then
            # "not behind / already up to date" is a no-op, not a failure. Anything else
            # (typically a rebase conflict) is a real failure the author must resolve.
            if echo "$out" | grep -qiE "not behind|already up[- ]?to[- ]?date|no new commits|up to date"; then
              echo "Branch already up to date with base; nothing to rebase."
            else
              gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" \
                -b "❌ Automatic rebase failed (likely a conflict). Please rebase manually.<details>$(echo "$out" | head -c 800)</details>" || true
              exit 1
            fi
          fi

  backport:
    name: Backport
    runs-on: [self-hosted, sync-normal]
    needs: info
    if: >
      contains(github.event.comment.body, '@Mergify backport') ||
      contains(github.event.comment.body, '@Mergifyio backport')
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      BRANCH: ${{ needs.info.outputs.branch }}
      ASSIGNEES: ${{ needs.info.outputs.assignees }}
      MERGE_COMMIT: ${{ needs.info.outputs.merge_commit }}
      GITHUB_TOKEN: ${{ secrets.SYNC_PAT }}
      ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Check Status
        run: |
          if [[ "${{ needs.info.outputs.state }}" != "MERGED" ]]; then
              gh pr comment ${PR_NUMBER} -R ${{ github.repository }} -b "❌ PR has not been merged yet!"
              exit 1
          fi

      - name: Checkout the latest code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: checkout tools
        uses: actions/checkout@v6
        with:
          repository: StarRocks/elastic-service
          path: './elastic-service'
          token: ${{ secrets.PAT }}
          fetch-depth: 1

      - name: BACKPORT
        id: backport
        run: |
          cd elastic-service
          ./bin/backport.sh "${{ needs.info.outputs.title }}" "${{ github.event.comment.body }}"

      - name: Report
        if: always() && steps.backport.outcome == 'failure'
        run: |
          gh pr comment ${PR_NUMBER} -R ${{ github.repository }} -b "❌ BACKPORT ERROR! <details></br></br>[Workflow details](${ACTION_URL})</details>"
          exit 1

  resolve-conflict-automerge:
    name: resolve conflict automerge
    runs-on: [ self-hosted, sync-normal ]
    if: >
      contains(github.event.comment.body, '@Mergify automerge') ||
      contains(github.event.comment.body, '@Mergifyio automerge')
    needs: info
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ secrets.PAT }}

    steps:
      - name: merge directly
        if: contains(needs.info.outputs.branch, '-sync-pr-')
        run: |
          gh pr merge ${PR_NUMBER} -R ${GITHUB_REPOSITORY} -s --admin

  close:
    name: CLOSE PR
    runs-on: [self-hosted, light]
    if: >
      contains(github.event.issue.pull_request.html_url, 'pull') &&
      (contains(github.event.comment.body, '@Mergify close') ||
      contains(github.event.comment.body, '@Mergifyio close'))

    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      GITHUB_TOKEN: ${{ secrets.PAT }}

    steps:
      - name: CLOSE
        run: |
          gh pr close ${PR_NUMBER} -R ${{ github.repository }} -c "PR was manually closed."

  automerge:
    name: AutoMerge PR
    runs-on: [self-hosted, light]
    if: >
      contains(github.event.issue.pull_request.html_url, 'pull') &&
      contains(github.event.comment.body, '@Mergify automerge')

    env:
      PR_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: BASE REF
        id: get_base_ref
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          data=$(gh pr view ${PR_NUMBER} -R ${{ github.repository }} --json baseRefName,headRefName,labels)
          echo "base_ref=$(echo "${data}" | jq -r '.baseRefName')" >> $GITHUB_OUTPUT
          echo "head_ref=$(echo "${data}" | jq -r '.headRefName')" >> $GITHUB_OUTPUT
          # ci-backport-checker treats both 'conflict' and 'conflicts' as conflict labels.
          echo "has_conflict=$(echo "${data}" | jq -r '([.labels[].name] | any(. == "conflict" or . == "conflicts"))')" >> $GITHUB_OUTPUT

      # Arm native auto-merge for a fixup PR whose base is a backport branch
      # (base mergify/bp) or a backport PR itself (head mergify/bp, no conflict label).
      # `|| true` tolerates a PR that already had auto-merge enabled or is already mergeable.
      - name: AutoMerge
        if: >
          startsWith(steps.get_base_ref.outputs.base_ref, 'mergify/bp') ||
          (startsWith(steps.get_base_ref.outputs.head_ref, 'mergify/bp') && steps.get_base_ref.outputs.has_conflict == 'false')
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          gh pr merge ${PR_NUMBER} -R ${{ github.repository }} -s --auto || true

      # Backport PRs target a protected release branch and need a +1. celerdata has few
      # reviewers, so (unlike sync PRs, which self-approve via APPROVE_PAT) they stall.
      # Give the automated approval to fire the auto-merge armed above.
      #  - Runs AFTER the arm step so --auto attaches while the PR is still blocked on
      #    review; approving first would make the PR immediately mergeable and
      #    `gh pr merge --auto` would then error with "Pull Request is not mergeable".
      #  - Restricted to trusted commenters (OWNER/MEMBER/COLLABORATOR) so an arbitrary
      #    commenter cannot make APPROVE_PAT bypass the human-review requirement.
      #  - Excludes conflicted backports (both 'conflict' and 'conflicts' labels).
      - name: Auto approve backport PR
        if: >
          startsWith(steps.get_base_ref.outputs.head_ref, 'mergify/bp') &&
          steps.get_base_ref.outputs.has_conflict == 'false' &&
          contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        uses: hmarr/auto-approve-action@v3
        with:
          pull-request-number: ${{ github.event.issue.number }}
          review-message: "Auto approved backport PR"
          github-token: ${{ secrets.APPROVE_PAT }}

  rerun:
    name: Rerun
    runs-on: [self-hosted, light]
    if: >
      contains(github.event.issue.pull_request.html_url, 'pull') &&
      contains(github.event.comment.body, 'Re-run the workflow')
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      GITHUB_TOKEN: ${{ secrets.PAT }}
      ROBOT_SERVER: ${{ secrets.ROBOT_URL }}

    steps:
      - name: CLOSE
        run: |
          ret=$(curl -sX POST -H "Content-Type: application/json" \
            -d "{\"repository\":\"${GITHUB_REPOSITORY}\", \"pr_id\":\"${PR_NUMBER}\"}" ${ROBOT_SERVER})
          ret_code=$(echo "${ret}" | jq -r '.result')
          if [[ '${ret_code}' == "false" ]]; then
            echo "Re-run failed!"
            exit 1
          fi
