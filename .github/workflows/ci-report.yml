          echo "size=${size}" >> $GITHUB_OUTPUT
          if [[ "$size" != "0" ]]; then
            ossutil64 --config-file ~/.ossutilconfig cp ${oss_path} . --recursive
          else
            cp /var/local/env/sqltester_empty_coverage.xml .
          fi

      - name: Prepare Tools
        id: prepare-tools
        run: |
          mkdir -p .actions/nose-report-action
          cd .actions/nose-report-action
          git clone https://github.com/StarRocks/action-junit-report.git .

      # Publish/report only if the producer job actually ran in THIS parent run.
      # OSS XML is scoped by PR+branch (not run), so a skipped/absent producer
      # would otherwise stamp stale XML onto the PR -- matters during the
      # transitional pull_request + pull_request_target double-run.
      - name: Producer ran?
        id: producer_gate
        if: always()
        run: |
          set -uo pipefail
          PJOBS=$(curl -fsS -m 15 -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs?per_page=100" || echo '{"jobs":[]}')
          PCONCL=$(printf '%s' "$PJOBS" | jq -r '[.jobs[]|select(.name=="SQL-Tester")|.conclusion]|first // "absent"')
          if [ "$PCONCL" = "success" ] || [ "$PCONCL" = "failure" ]; then
            echo "ran=true" >> $GITHUB_OUTPUT
          else
            echo "ran=false" >> $GITHUB_OUTPUT
            echo "::notice::producer 'SQL-Tester' did not run this attempt (conclusion=$PCONCL); skip to avoid stale XML"
          fi

      - name: Report test results to CI Metrics
        if: always() && steps.producer_gate.outputs.ran == 'true'
        continue-on-error: true
        env:
          CI_METRICS_TOKEN: ${{ secrets.CI_METRICS_TOKEN }}
          CI_METRICS_CA: ${{ secrets.CI_METRICS_CA }}
        run: |
          set -uo pipefail
          CA="${RUNNER_TEMP:-/tmp}/ci_metrics_ca.pem"
          printf '%s' "$CI_METRICS_CA" > "$CA"
          rm -rf ./ci-tool-metrics && cp -rf /var/lib/ci-tool ./ci-tool-metrics && (cd ./ci-tool-metrics && git pull -q || true)
          python3 ./ci-tool-metrics/bin/report_test_results.py \
            --test-type sql-tester \
            --run-id ${{ github.event.workflow_run.id }} \
            --run-attempt ${{ github.event.workflow_run.run_attempt }} \
            --api https://47.236.49.47:8080 --ca "$CA" \
            --finished-at "${{ github.event.workflow_run.updated_at }}" \
            sql-tester-result/*.xml || true
      - name: Publish SQL-Tester Report
        uses: ./.actions/nose-report-action
        if: steps.prepare-tools.outcome == 'success' && steps.producer_gate.outputs.ran == 'true'
        with:
          check_name: "SQL-Tester Report"
          fail_on_failure: true
          detailed_summary: true
          token: ${{ secrets.GITHUB_TOKEN }}
          commit: ${{ env.HEAD_SHA }}
          report_paths: "sql-tester-result/*.xml"

