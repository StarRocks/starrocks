  NOTIFICATION:
    runs-on: [self-hosted, quick]
    needs:
      [
        INFO,
        FE-REPORT,
        Admit-REPORT,
        BE-REPORT,
        SQL-Tester-REPORT,
        JAVA-EXTENSION-REPORT,
      ]
    if: always() && needs.INFO.outputs.PR_NUMBER != '' && needs.INFO.outputs.PR_STATE != 'MERGED'
    env:
      WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      PR_NUMBER: ${{ needs.INFO.outputs.PR_NUMBER }}
    steps:
      - name: CLEAN
        run: |
          # Keep .git so actions/checkout reuses the clone and fetches incrementally
          git -C ${{ github.workspace }} clean -ffdxq 2>/dev/null || { rm -rf ${{ github.workspace }}; mkdir -p ${{ github.workspace }}; }

      - name: NOTIFY
        run: |
          rm -rf ./ci-tool && cp -rf /var/lib/ci-tool ./ci-tool && cd ci-tool && git pull && source lib/init.sh
          ./bin/notify.sh

      - name: Clean ENV
        if: always()
        run: |
          git -C ${{ github.workspace }} clean -ffdxq 2>/dev/null || rm -rf ${{ github.workspace }}/*
