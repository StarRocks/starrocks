name: SYNC PIPELINE

on:
  pull_request_target:
    branches:
      - main
      - 'branch-[0-9].[0-9]*'
    types:
      - closed
  workflow_dispatch:

jobs:
  sync:
    runs-on: [self-hosted, sync]
    if: github.event.pull_request.merged == true && github.repository == 'StarRocks/starrocks'
    env:
      PR_NUMBER: ${{ github.event.number }}
      GH_TOKEN: ${{ secrets.PAT2 }}
      MS_PAT: ${{ secrets.MS_PAT }}
    steps:
      - name: commit_sha
        id: commit_sha
        run: |
          set -x
          pr_info=$(gh pr view ${PR_NUMBER} -R ${{ github.repository }} --json mergeCommit,labels)
          labels=`echo $pr_info | jq -r '.labels[].name'`
          # Anti-loop: skip forward SR->CD sync for reverse-synced PRs. `sync` covers the
          # SR main PR; `cd-contributed` also covers its mergify backport PRs (which do NOT
          # inherit `sync` — contributed-backport-label.yml stamps them cd-contributed).
          if [[ "${labels}" =~ sync || "${labels}" =~ cd-contributed ]]; then
            echo "is_sync=true" >> $GITHUB_OUTPUT
          else
            commit_sha=`echo $pr_info | jq -r '.mergeCommit.oid'`
            echo "commit_sha=${commit_sha:0:7}" >> $GITHUB_OUTPUT
          fi

      - name: sync
        if: steps.commit_sha.outputs.is_sync != 'true'
        env:
          PR_ID: ${{ github.event.number }}
          COMMIT_ID: ${{ steps.commit_sha.outputs.commit_sha }}
          BRANCH: ${{ github.base_ref }}
        run: |
          rm -rf ./ci-tool && cp -rf /var/lib/ci-tool ./ci-tool && cd ci-tool && timeout 60 git pull >/dev/null || echo "git pull timeout, using cached ci-tool"
          ./scripts/run-repo-sync.sh
