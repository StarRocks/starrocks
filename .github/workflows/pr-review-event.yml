name: PR REVIEW EVENT

# Relays a review to PR RECORD (pr-record.yml), which records the PR's approvers on this
# run's workflow_run. pull_request_review has no _target variant: on a fork PR this run gets
# no secrets and a read-only token, so it cannot report to CI Metrics itself. It checks out
# nothing and runs no PR code.

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - run: echo "review ${{ github.event.action }} on PR ${{ github.event.pull_request.number }}"
