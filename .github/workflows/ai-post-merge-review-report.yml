name: AI POST-MERGE REVIEW REPORT

# Report half of the post-merge severe-risk review chain. Codex delivers its result
# as a pull request *review* (the summary + inline findings), so we react to
# `pull_request_review: submitted` -- NOT issue_comment: on a closed PR codex submits
# a review but does not reliably leave a top-level issue comment, so an issue_comment
# trigger would silently miss the findings (observed on #61390). The script then
# correlates that review to our post-merge REVIEW.md trigger, takes its inline
# findings, and opens a tracking issue assigned to the PR author. Returns in seconds --
# no polling. Idempotent (one issue per PR).

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  report:
    name: AI Post-Merge Review (report)
    # Only codex reviews, and only on merged/closed PRs (post-merge). The script's own
    # correlation (a CelerData-Reviewer REVIEW.md trigger comment before the review)
    # further guarantees this is our post-merge flow and not a stray pre-merge review.
    if: >
      github.repository == 'CelerData/celerdata-enterprise' &&
      github.event.pull_request.state == 'closed' &&
      github.event.review.user.login == 'chatgpt-codex-connector[bot]'
    # quick (not light): needs the /var/lib/ci-tool bind-mount for the orchestration
    # script; light is a deliberately ci-tool-free pool. Seconds-long event-driven job.
    runs-on: [self-hosted, quick]
    steps:
      - name: open issue on codex post-merge findings
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          MODE: report
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          rm -rf ./ci-tool && cp -rf /var/lib/ci-tool ./ci-tool
          # git pull is best-effort: the bind-mounted copy is already runnable, so a
          # transient fetch failure must not block the job -- fall back to it and go on.
          cd ci-tool && (git pull || true)
          python3 bin/post_merge_review.py
