name: AI POST-MERGE REVIEW REPORT

# Report half of the post-merge severe-risk review chain. Fires on codex's comments
# on closed PRs; the script finds the codex review answering our post-merge trigger,
# takes its findings, and opens a tracking issue assigned to the PR author. Returns
# in seconds -- no polling. Idempotent (one issue per PR).

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  report:
    name: AI Post-Merge Review (report)
    if: >
      github.repository == 'CelerData/celerdata-enterprise' &&
      github.event.issue.pull_request &&
      github.event.issue.state == 'closed' &&
      github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
    # quick (not light): needs the /var/lib/ci-tool bind-mount for the orchestration
    # script; light is a deliberately ci-tool-free pool. Seconds-long event-driven job.
    runs-on: [self-hosted, quick]
    steps:
      - name: open issue on codex post-merge findings
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          MODE: report
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          PR_TITLE: ${{ github.event.issue.title }}
          PR_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          rm -rf ./ci-tool && cp -rf /var/lib/ci-tool ./ci-tool
          # git pull is best-effort: the bind-mounted copy is already runnable, so a
          # transient fetch failure must not block the job -- fall back to it and go on.
          cd ci-tool && (git pull || true)
          python3 bin/post_merge_review.py
