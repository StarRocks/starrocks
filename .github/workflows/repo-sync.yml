name: Repo Sync
run-name: Repo Sync(#${{ inputs.PR_ID }} [${{ inputs.BRANCH }}])

on:

  workflow_dispatch:
    inputs:
      PR_ID:
        description: 'ORI PR ID'
        required: true
        type: string
      COMMIT_ID:
        description: 'ORI COMMIT ID'
        required: true
        type: string
      BRANCH:
        description: 'TARGET BRANCH'
        required: true
        type: string
        default: 'main'
      SOURCE_REPO:
        description: 'SOURCE REPOSITORY'
        required: true
        type: string
        default: 'StarRocks/starrocks'
      DEBUG:
        description: 'DEBUG REPO'
        required: true
        type: boolean
        default: false

permissions:
  checks: write
  actions: write
  contents: write
  deployments: write
  discussions: write
  issues: write
  packages: write
  pages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

env:
  source_repo: ${{ inputs.SOURCE_REPO }}

jobs:

  pr-info:
    name: Add PR Information
    runs-on: [self-hosted, sync-normal]
    env:
      PR_ID: ${{ inputs.PR_ID }}
      SYNC_PAT: ${{ secrets.SYNC_PAT }}
    outputs:
      assignees: ${{ steps.ori_pr_info.outputs.assignees }}
      title: ${{ steps.ori_pr_info.outputs.title }}
    steps:
      - name: Ori PR Info
        id: ori_pr_info
        run: |
          cd /var/lib/elastic-service
          git pull || true
          ./lib/get_pr_info.sh

  repo-sync-main:
    name: Repo Sync - main
    runs-on: [ self-hosted, sync-main ]
    if: inputs.BRANCH == 'main'
    needs: pr-info
    env:
      GITHUB_TOKEN: ${{ secrets.SYNC_PAT }}
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
    steps:
      - name: clean
        run: |
          rm -rf ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}

      - name: checkout code
        run: |
          shopt -s dotglob
          cp -rf /var/lib/celerdata-enterprise/* ${{ github.workspace }}
          shopt -u dotglob

      - name: Clean Branches
        env:
          source_branch: ${{ inputs.BRANCH }}-sync-${{ inputs.PR_ID }}
          destination_branch: ${{ inputs.BRANCH }}-sync-pr-${{ inputs.PR_ID }}
        run: |
          curl -s -X DELETE -u username:${{secrets.GITHUB_TOKEN}} https://api.github.com/repos/${{ github.repository }}/git/refs/heads/${{ env.source_branch }}
          curl -s -X DELETE -u username:${{secrets.GITHUB_TOKEN}} https://api.github.com/repos/${{ github.repository }}/git/refs/heads/${{ env.destination_branch }}

      - name: sync repo to branch
        env:
          source_branch: ${{ inputs.BRANCH }}
          destination_branch: ${{ inputs.BRANCH }}-sync-${{ inputs.PR_ID }}
          github_token: ${{ secrets.SYNC_PAT }}
        run: |
          source_repo_dir=${source_repo#*/}
          cp -rf /var/local/env/ci-source-code/${source_repo_dir} ${source_repo_dir}
          cd ${source_repo_dir} && git pull
          git checkout ${source_branch}
          git remote set-url origin https://${github_token}@github.com/${{ github.repository }}.git
          git push origin ${source_branch}:${destination_branch}

      - name: checkout tools
        run: |
          cp -rf /var/lib/elastic-service ./elastic-service
          cd elastic-service
          git pull

      - name: pr branch
        run: |
          git pull
          git checkout ${{ inputs.BRANCH }}
          pr_branch=${{ inputs.BRANCH }}-sync-pr-${{ inputs.PR_ID }}
          git branch ${pr_branch} ${{ inputs.BRANCH }}
          git checkout ${pr_branch}
          git push -u origin ${pr_branch}

      - name: previous check
        id: previous-check
        run: |
          cd ${{ github.workspace }}/elastic-service
          check_res=$(python3 lib/pr_sequence_checker.py new ${{ inputs.BRANCH }} ${{ inputs.PR_ID }} ${{ inputs.COMMIT_ID }})
          echo ${check_res}
          conflict_prs=$(echo ${check_res} | awk -F'Files:' '{print $1}' | awk -F' ' '{print $NF}')
          echo CONFLICT_PRS=${conflict_prs} >> $GITHUB_OUTPUT
          check_res=$(echo $check_res | tail -n 1)
          echo RES=${check_res} >> $GITHUB_OUTPUT

      - name: refresh base before cherry-pick
        # Close the race window between "pr branch" and "cherry pick":
        # previous-check can take 2-3 minutes (GitHub branches API), and if
        # another sync PR merges to origin/${BRANCH} in that window, the local
        # pr_branch is stale. Cherry-picking a follow-up commit on a stale
        # base produces conflict markers that get committed into the PR
        # (see #55895 / #56041). Force the pr_branch tip to current
        # origin/${BRANCH} right before cherry-pick; it carries no commits
        # of its own yet so reset --hard is safe.
        #
        # Explicit cd: the previous step ("previous check") cd'd into
        # elastic-service. GH Actions resets cwd between steps, but staying
        # explicit matches the surrounding convention and is robust to future
        # reorderings.
        run: |
          cd ${{ github.workspace }}
          git fetch origin ${{ inputs.BRANCH }}
          git reset --hard origin/${{ inputs.BRANCH }}

      - name: cherry pick
        id: cherry-pick
        run: |
          cd ${{ github.workspace }}/elastic-service
          ./lib/run_cherry_pick.sh --pr ${{ inputs.PR_ID }}
          cd ${{ github.workspace }}
          # No --force needed: the "pr branch" step pushed pr_branch at M0
          # (stale main); after the refresh step local pr_branch = M1
          # (fresh main, descendant of M0 since main only advances), and
          # cherry-pick adds X on top → local = M1+X is a descendant of M0.
          # So this is a fast-forward push.
          git push -u origin ${{ inputs.BRANCH }}-sync-pr-${{ inputs.PR_ID }}

      - name: Create pull request
        id: create_pr
        if: steps.previous-check.outputs.RES == 'True'
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_PAT }}
          PR_LABEL: sync,${{ inputs.BRANCH }},${{ steps.cherry-pick.outputs.LABEL }}${{ steps.cherry-pick.outputs.CONFLICT_LABEL }}
          HEAD: ${{ inputs.BRANCH }}-sync-pr-${{ inputs.PR_ID }}
          TITLE: "${{ needs.pr-info.outputs.title }}(sync #${{ inputs.PR_ID }})"
          BODY_FILE: /var/local/env/body/${{ github.repository }}/${{ inputs.PR_ID }}.txt
          REVIEWER: ${{ needs.pr-info.outputs.assignees }}
          BASE: ${{ inputs.BRANCH }}
        run: |
          cd ${{ github.workspace }}/elastic-service
          ./scripts/create_sync_repo.sh

      # previous pr files' check pending
      - name: Create pending pull request
        id: create_pending_pr
        if: steps.previous-check.outputs.RES != 'True'
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_PAT }}
          PR_LABEL: "sync,${{ inputs.BRANCH }},${{ steps.cherry-pick.outputs.LABEL }},pending"
          HEAD: ${{ inputs.BRANCH }}-sync-pr-${{ inputs.PR_ID }}
          TITLE: "${{ needs.pr-info.outputs.title }}(sync #${{ inputs.PR_ID }})"
          BODY: "Previous prs: ${{ steps.previous-check.outputs.CONFLICT_PRS }}"
          REVIEWER: ${{ needs.pr-info.outputs.assignees }}
          BASE: ${{ inputs.BRANCH }}
        run: |
          cd ${{ github.workspace }}/elastic-service
          ./scripts/create_sync_repo.sh

      # Unexpected failure
      - name: Create Error pull request
        id: create_error_pr
        if: >
          always() && 
          ( steps.previous-check.outcome == 'failure' ||
            steps.cherry-pick.outcome == 'failure' ||
            steps.create_pr.outcome == 'failure' ||
            steps.create_pending_pr.outcome == 'failure')
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_PAT }}
          PR_LABEL: "sync,${{ inputs.BRANCH }},${{ steps.cherry-pick.outputs.LABEL }},conflict,ERROR"
          HEAD: ${{ inputs.BRANCH }}-sync-${{ inputs.PR_ID }}
          BASE: ${{ inputs.BRANCH }}-sync-pr-${{ inputs.PR_ID }}
          TITLE: "${{ needs.pr-info.outputs.title }}(sync #${{ inputs.PR_ID }})"
          BODY_FILE: /var/local/env/body/${{ github.repository }}/${{ inputs.PR_ID }}.txt
          REVIEWER: ${{ needs.pr-info.outputs.assignees }}
        run: |
          cd ${{ github.workspace }}/elastic-service
          ./scripts/create_sync_repo.sh

      - name: notify
        if: always()
        env:
          branch: ${{ inputs.BRANCH }}
          source_pr: ${{ inputs.PR_ID }}
          source_commit_id: ${{ inputs.COMMIT_ID }}
          action_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          cd ${{ github.workspace }}
          if [[ ! -d ${{ github.workspace }}/elastic-service ]]; then
            cp -rf /var/lib/elastic-service ./elastic-service
          fi
          cd elastic-service && git pull
          if [[ "${{ steps.cherry-pick.outputs.CONFLICT_LABEL }}" != '' && "${{ steps.create_pr.outcome }}" == 'success' ]]; then
            msg_type="conflict"
            this_pr_url=${{ steps.create_pr.outputs.pr_url }}
          elif [[ "${{ steps.create_pending_pr.outcome }}" == 'success' ]]; then
            msg_type="pending"
            this_pr_url=${{ steps.create_pending_pr.outputs.pr_url }}
          elif [[ "${{ steps.create_pr.outcome }}" == 'success' ]]; then
            exit 0;
          else
            msg_type="error"
            this_pr_url=${{ steps.create_error_pr.outputs.pr_url }}
          fi
          python3 lib/sync_notify.py ${msg_type} ${branch} ${source_pr} ${source_commit_id} ${action_url} ${this_pr_url}

      - name: Trigger pending scan
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          gh workflow run sync-scan-pending.yml \
            -R ${{ github.repository }} || true

      - name: clean
        if: always()
        env:
          BODY_FILE: /var/local/env/body/${{ github.repository }}/${{ inputs.PR_ID }}.txt
        run: |
          rm -f ${BODY_FILE}
          rm -rf ${{ github.workspace }} && mkdir -p ${{ github.workspace }}

  repo-sync-branch:
    name: Repo Sync - branch
    runs-on: [ self-hosted, sync-branch ]
    if: inputs.BRANCH != 'main'
    needs: pr-info
    env:
      GITHUB_TOKEN: ${{ secrets.SYNC_PAT }}
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
    steps:
      - name: clean
        run: |
          rm -rf ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}

      - name: checkout code
        run: |
          shopt -s dotglob
          cp -rf /var/lib/celerdata-enterprise/* ${{ github.workspace }}
          shopt -u dotglob

      - name: Clean Branches
        env:
          source_branch: ${{ inputs.BRANCH }}-sync-${{ inputs.PR_ID }}
          destination_branch: ${{ inputs.BRANCH }}-sync-pr-${{ inputs.PR_ID }}
        run: |
          curl -s -X DELETE -u username:${{secrets.GITHUB_TOKEN}} https://api.github.com/repos/${{ github.repository }}/git/refs/heads/${{ env.source_branch }}
          curl -s -X DELETE -u username:${{secrets.GITHUB_TOKEN}} https://api.github.com/repos/${{ github.repository }}/git/refs/heads/${{ env.destination_branch }}

      - name: sync repo to branch
        env:
          source_branch: ${{ inputs.BRANCH }}
          destination_branch: ${{ inputs.BRANCH }}-sync-${{ inputs.PR_ID }}
          github_token: ${{ secrets.SYNC_PAT }}
        run: |
          source_repo_dir=${source_repo#*/}
          cp -rf /var/local/env/ci-source-code/${source_repo_dir} ${source_repo_dir}
          cd ${source_repo_dir} && git pull
          git checkout ${source_branch}
          git remote set-url origin https://${github_token}@github.com/${{ github.repository }}.git
          git push origin ${source_branch}:${destination_branch}

      - name: checkout tools
        run: |
          cp -rf /var/lib/elastic-service ./elastic-service
          cd elastic-service
          git pull

      - name: pr branch
        run: |
          git pull
          git checkout ${{ inputs.BRANCH }}
          pr_branch=${{ inputs.BRANCH }}-sync-pr-${{ inputs.PR_ID }}
          git branch ${pr_branch} ${{ inputs.BRANCH }}
          git checkout ${pr_branch}
          git push -u origin ${pr_branch}

      - name: previous check
        id: previous-check
        run: |
          cd ${{ github.workspace }}/elastic-service
          check_res=$(python3 lib/pr_sequence_checker.py new ${{ inputs.BRANCH }} ${{ inputs.PR_ID }} ${{ inputs.COMMIT_ID }})
          echo ${check_res}
          conflict_prs=$(echo ${check_res} | awk -F'Files:' '{print $1}' | awk -F' ' '{print $NF}')
          echo CONFLICT_PRS=${conflict_prs} >> $GITHUB_OUTPUT
          check_res=$(echo $check_res | tail -n 1)
          echo RES=${check_res} >> $GITHUB_OUTPUT

      - name: refresh base before cherry-pick
        # Close the race window between "pr branch" and "cherry pick":
        # previous-check can take 2-3 minutes (GitHub branches API), and if
        # another sync PR merges to origin/${BRANCH} in that window, the local
        # pr_branch is stale. Cherry-picking a follow-up commit on a stale
        # base produces conflict markers that get committed into the PR
        # (see #55895 / #56041). Force the pr_branch tip to current
        # origin/${BRANCH} right before cherry-pick; it carries no commits
        # of its own yet so reset --hard is safe.
        #
        # Explicit cd: the previous step ("previous check") cd'd into
        # elastic-service. GH Actions resets cwd between steps, but staying
        # explicit matches the surrounding convention and is robust to future
        # reorderings.
        run: |
          cd ${{ github.workspace }}
