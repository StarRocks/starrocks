name: SYNC CI PIPELINE

on:
  pull_request_target:
    types:
      - opened
      - synchronize

    branches:
      - main
      # Both release lines and patch lines: BUILD is a required status check on
      # branch-X.Y.Z too, so this workflow must fire there or those PRs never
      # get a BUILD result and stay blocked forever.
      - 'branch-[0-9]+.[0-9]+'
      - 'branch-[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.event.number }}-sync-checker
  cancel-in-progress: true


permissions:
  checks: write
  actions: write
  contents: write
  deployments: write
  discussions: write
  issues: write
  packages: write
  pages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

jobs:
  pr-label:
    runs-on: [ self-hosted, sync-normal ]
    name: PR LABEL
    env:
      PR_NUMBER: ${{ github.event.number }}
    outputs:
      labels: ${{ steps.labels.outputs.LABELS }}
    steps:
      - run: sleep 10
      - name: Get PR labels
        id: labels
        run: |
          set -x 
          labels=`curl -L \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER} 2>/dev/null \
                  | jq '.labels[].name'`
          labels=`echo "$labels" | tr "\"" " " | tr "\n" " "`
          echo "LABELS=$labels" >> $GITHUB_OUTPUT

  sync-checker:
    runs-on: [ self-hosted, sync-normal ]
    needs: pr-label
    if: >
      contains(github.event.pull_request.title, '(sync #') &&
      contains(needs.pr-label.outputs.labels, 'sync') &&
      !contains(needs.pr-label.outputs.labels, 'pending') &&
      !contains(needs.pr-label.outputs.labels, 'force-check')
    name: RUN CHECKER
    steps:
      - run: echo "success"
      - run: |
          echo "${{ github.event.pull_request.title }}"
          echo "${{ github.head_ref }}"

  code-checker:
    runs-on: [ self-hosted, sync-normal ]
    needs: sync-checker
    name: CODE FILTER
    outputs:
      output1: ${{ steps.changes-info.outputs.be }}
      output2: ${{ steps.changes-info.outputs.thirdparty }}
      output3: ${{ steps.changes-info.outputs.fe }}
      linux_matrix: ${{ steps.distro.outputs.linux_matrix }}
    steps:
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            be:
              - 'be/**'
              - 'gensrc/**'
              - 'run-be-ut.sh'
              - 'build.sh'
              - 'thirdparty/**'
              - 'docker/dockerfiles/dev-env/dev-env.Dockerfile'
            fe:
              - 'fe/**'
              - 'gensrc/**'
              - 'run-fe-ut.sh'
              - 'java-extensions/**'
              - 'build.sh'
              - 'test/**'

      # Dedicated step for thirdparty filter: needs `predicate-quantifier: every`
      # so negated patterns (e.g. `!thirdparty/build-thirdparty-darwin.sh`) act
      # as exclusions. With the default `some`, a positive `thirdparty/**`
      # match alone is sufficient and exclusions silently no-op.
      - uses: dorny/paths-filter@v3
        id: linux-thirdparty-filter
        with:
          predicate-quantifier: every
          filters: |
            thirdparty:
              - 'thirdparty/**'
              - '!thirdparty/build-thirdparty-darwin.sh'
              - '!thirdparty/vars-darwin-aarch64.sh'
            dev_env:
              - 'docker/dockerfiles/dev-env/dev-env.Dockerfile'

      - name: CHECK INFO
        id: changes-info
        run: |
          thirdparty=false
          if [[ "${{ steps.linux-thirdparty-filter.outputs.thirdparty }}" == 'true' || "${{ steps.linux-thirdparty-filter.outputs.dev_env }}" == 'true' ]]; then
            thirdparty=true
          fi
          echo "be=${{ steps.changes.outputs.be }}" >> $GITHUB_OUTPUT
          echo "thirdparty=${thirdparty}" >> $GITHUB_OUTPUT
          echo "fe=${{ steps.changes.outputs.fe }}" >> $GITHUB_OUTPUT

      - name: Decide distros by version
        id: distro
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # rocky9 replaces centos7 from 4.2 onward (CentOS 7 EOL):
          #   main / >= 4.2 -> rocky9 + ubuntu
          #   < 4.2         -> centos7 + ubuntu
          # Mirrors ci-pipeline.yml (main uses rocky9) and StarRocks 39ad6c7.
          if [[ "${BASE_REF}" == "main" ]]; then
            el=rocky9
          else
            ver=${BASE_REF#branch-}; major=${ver%%.*}; rest=${ver#*.}; minor=${rest%%.*}
            if (( major > 4 || (major == 4 && minor >= 2) )); then el=rocky9; else el=centos7; fi
          fi
          echo "linux_matrix=[\"${el}\", \"ubuntu\"]" >> $GITHUB_OUTPUT

      - name: LABEL THIRDPARTY
        if: steps.changes-info.outputs.thirdparty == 'true'
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.PAT }}
          labels: thirdparty

  thirdparty-update:
    runs-on: [self-hosted, sync-normal]
    needs: [code-checker]
    name: Thirdparty Update
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        linux: ${{ fromJSON(needs.code-checker.outputs.linux_matrix) }}
    env:
      PR_NUMBER: ${{ github.event.number }}
      BRANCH: ${{ github.base_ref }}
      REPO: ${{ github.repository }}
    # Retired: with Sync Build gone and be-ut-refactor-compile retired below,
    # nothing consumes the thirdparty image in this workflow anymore. The
    # general pipeline (CI PIPELINE / CI PIPELINE - BRANCH) already builds
    # thirdparty for sync PRs. Kept as a (skipped) job so downstream needs stay
    # valid. This matrix produces `Thirdparty Update (<distro>)` contexts, not
    # the bare `Thirdparty Update` required on release branches (that comes from
    # CI PIPELINE - BRANCH), so skipping it here blocks nothing.
    if: false
    steps:
      - name: clean
        run: |
          # Keep .git so actions/checkout reuses the clone and fetches incrementally
          git -C ${{ github.workspace }} clean -ffdxq 2>/dev/null || { rm -rf ${{ github.workspace }}; mkdir -p ${{ github.workspace }}; }

      - name: Checkout Code
        # v6: resets leftover sparse state and local branches on a reused
        # workspace, and persists credentials outside .git/config.
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update Image (${{ matrix.linux }})
        id: update-image
        if: needs.code-checker.outputs.output2 == 'true'
        env:
          linux_distro: ${{ matrix.linux }}
        run: |
          rm -rf ./ci-tool && cp -rf /var/lib/ci-tool ./ci-tool && cd ci-tool && git pull && source lib/init.sh
          ./bin/run-pr-update-image.sh

      - name: Upload Thirdparty Result
        uses: actions/upload-artifact@v4
        with:
          name: THIRDPARTY-RESULT-${{ matrix.linux }}
          path: image_cache.info
          retention-days: 1
          overwrite: true

      - name: Clean ENV
        if: always() && needs.code-checker.outputs.output2 == 'true'
        run: |
          cd ci-tool && source lib/init.sh
          ./bin/elastic-cluster.sh --delete
          git -C ${{ github.workspace }} clean -ffdxq 2>/dev/null || rm -rf ${{ github.workspace }}/*

  thirdparty-info:
    runs-on: [self-hosted, sync-normal]
    needs:
      - thirdparty-update
    name: Thirdparty Info
    # Retired: its only consumers (Sync Build, be-ut-refactor-compile) are
    # retired. Kept as a skipped job so the `Thirdparty Info` required check
    # still reports (skipped=pass; the general pipeline produces the real one
    # for sync PRs) and downstream needs stay valid.
    if: false
    outputs:
      centos7_image_cache_id: ${{ steps.info.outputs.centos7_image_cache_id }}
      ubuntu_image_cache_id: ${{ steps.info.outputs.ubuntu_image_cache_id }}
    steps:
      - name: clean
        run: |
          # Keep .git so actions/checkout reuses the clone and fetches incrementally
          git -C ${{ github.workspace }} clean -ffdxq 2>/dev/null || { rm -rf ${{ github.workspace }}; mkdir -p ${{ github.workspace }}; }

      - name: Check Result
        run: |
          if [[ "${{ needs.thirdparty-update.result }}" == 'failure' ]]; then
            echo "::error:: Thirdparty Update Error!"
            exit 1
          fi

      - name: Download Thirdparty Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: THIRDPARTY-RESULT-*
          path: outputs

      - name: Read Info
        id: info
        if: needs.thirdparty-update.result == 'success'
        run: |
          image_cache_id=$(cat "./outputs/THIRDPARTY-RESULT-centos7/image_cache.info" || echo "")
          echo "centos7_image_cache_id=${image_cache_id}" >> $GITHUB_OUTPUT
          image_cache_id=$(cat "./outputs/THIRDPARTY-RESULT-ubuntu/image_cache.info" || echo "")
          echo "ubuntu_image_cache_id=${image_cache_id}" >> $GITHUB_OUTPUT

  build:
    runs-on: [self-hosted, sync-normal]
    needs: [thirdparty-info]
    # celerdata-first: sync PRs now get their build+test from the general pipeline
    # (CI PIPELINE on main / CI PIPELINE - BRANCH on release branches), so this
    # Sync Build is retired. Kept as a (skipped) job so downstream `needs: build`
    # and `needs.build.result == 'skipped'` references stay valid; branch
    # protection (BE UT / FE UT) is now the real build/test gate.
    if: false
    # Static, distinct name so this check never collides with ci-pipeline.yml's
    # `BUILD` context on main. `BUILD` is no longer a required check on release
    # branches, so this no longer needs to be named `BUILD`; and a `${{ }}`
    # job-name expression is NOT evaluated for a skipped job's check run (it
    # renders the raw template), so a conditional name cannot be used.
    name: Sync Build
    env:
      PR_NUMBER: ${{ github.event.number }}
      BRANCH: ${{ github.base_ref }}
      LINUX_DISTRO: ubuntu
    outputs:
      build_output_tar: ${{ steps.run_build.outputs.OUTPUT_TAR }}
      base_version: ${{ steps.run_build.outputs.BASE_VERSION }}
    steps:
      - name: clean
        run: |
          # Keep .git so actions/checkout reuses the clone and fetches incrementally
          git -C ${{ github.workspace }} clean -ffdxq 2>/dev/null || { rm -rf ${{ github.workspace }}; mkdir -p ${{ github.workspace }}; }

      - name: BRANCH INFO
        id: branch
        run: |
          echo ${{github.base_ref}}
          echo "branch=${{github.base_ref}}" >> $GITHUB_OUTPUT

      - name: UPDATE ECI & RUN BUILD
        id: run_build
        shell: bash
        timeout-minutes: 90
        env:
          SKIP_OSS: 'true'
        run: |
          rm -rf ./ci-tool && cp -rf /var/lib/ci-tool ./ci-tool && cd ci-tool && git pull && source lib/init.sh
          if [[ "${{ needs.thirdparty-info.outputs.ubuntu_image_cache_id }}" != '' ]]; then
              export image_cache_id=${{ needs.thirdparty-info.outputs.ubuntu_image_cache_id }}
              export image_tag=$BRANCH-$PR_NUMBER
          fi
          ./bin/elastic-build.sh --pr ${PR_NUMBER} --branch ${BRANCH} --repository ${{ github.repository }} --linuxdistro ${LINUX_DISTRO}

      - name: build result
        run: |
          echo ${{ steps.run_build.outputs.OUTPUT_TAR }}

      - name: clean ECI
        if: always()
        run: |
          echo ${{ steps.run_build.outputs.ECI_ID }}
          eci rm ${{ steps.run_build.outputs.ECI_ID }}

      - name: Clean ENV
        if: always()
        run: |
          rm -f ${{ steps.run_build.outputs.RES_FILE }}
          rm -f ${{ steps.run_build.outputs.RES_LOG }}

  # Refactor sync PRs often break enterprise-only BE UT compilation: OSS CI
  # never compiles enterprise-only files (e.g. external_cluster_snapshot), so a
  # symbol renamed/moved upstream by a refactor only surfaces once synced here.
  # For [Refactor] sync PRs that touch BE, compile all BE UT targets (dry-run,
  # no test execution) to catch the break before the sync merges to main.
  be-ut-refactor-compile:
    runs-on: [self-hosted, sync-normal]
    needs: [ code-checker, thirdparty-info ]
    name: BE UT (Refactor compile-check)
    timeout-minutes: 120
    # Retired: celerdata-first runs the general pipeline for sync PRs, whose
    # BE UT (CI PIPELINE on main / CI PIPELINE - BRANCH on release branches --
    # the latter actually runs BE UT after this PR's be-ut `if` fix) compiles
    # and tests BE. This standalone [Refactor] compile-check is now redundant.
    # Kept as a skipped job so its required check reports skipped=pass and
    # downstream needs.be-ut-refactor-compile references stay valid.
    if: false
    env:
      PR_NUMBER: ${{ github.event.number }}
      BRANCH: ${{ github.base_ref }}
      IMAGE_CACHE_ID: ${{ needs.thirdparty-info.outputs.ubuntu_image_cache_id }}
      LINUX_DISTRO: ubuntu
    steps:
      - name: INIT ECI & RUN UT (compile-only)
        id: run_ut
        shell: bash
        run: |
          rm -rf ./ci-tool && cp -rf /var/lib/ci-tool ./ci-tool && cd ci-tool && git pull && source lib/init.sh
          if [[ "${IMAGE_CACHE_ID}" != '' ]]; then
              export image_cache_id=${IMAGE_CACHE_ID}
              export image_tag=$BRANCH-$PR_NUMBER
          fi
          ./bin/elastic-ut.sh --pr ${PR_NUMBER} --module be --branch ${BRANCH} --repository ${{ github.repository }} --linuxdistro ${LINUX_DISTRO} --compile-only

      - name: clean ECI
        if: always() && steps.run_ut.outputs.ECI_ID != ''
        run: |
          echo ${{ steps.run_ut.outputs.ECI_ID }}
          eci rm ${{ steps.run_ut.outputs.ECI_ID }} || true

      - name: Clean ENV
        if: always()
        run: |
          git -C ${{ github.workspace }} clean -ffdxq 2>/dev/null || rm -rf ${{ github.workspace }}/*

  result:
    runs-on: [self-hosted, sync-normal]
    needs: [ pr-label, code-checker, build, be-ut-refactor-compile ]
    name: RESULT
    if: >
      always() && (!contains(needs.pr-label.outputs.labels, 'conflict') || github.event.action != 'opened')
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.number }}
      BRANCH: ${{ github.base_ref }}
      GITHUB_TOKEN: ${{ secrets.PAT }}
      ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: add label
        uses: actions-ecosystem/action-add-labels@v1
        if: needs.build.result == 'failure' || needs.be-ut-refactor-compile.result == 'failure'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: ERROR

      - name: remove label
        uses: actions-ecosystem/action-remove-labels@v1
        if: needs.build.result != 'failure' && needs.be-ut-refactor-compile.result != 'failure'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: ERROR

      # Auto-clear the `conflict` label when a `synchronize` push has
      # resolved the cherry-pick conflict. Without this, RD must run the
      # ci-robot `conflict_resolved <PR>` command by hand (doc 004) even
      # though their fix-push has already addressed everything.
      #
      # Two safety checks before removing the live label:
      #   1. `gh pr diff` must not contain any conflict markers
      #      (same regex as elastic-service ci_robot/api.py PR #1275)
      #   2. `gh pr view --json mergeable` must report MERGEABLE
      #      (poll 3x because GitHub computes asynchronously)
      #
      # Sets step output `conflict_cleared=true` so the downstream rescue
      # trio (originally only for stale ERROR) can also fire for the
      # stale-conflict case via a single OR clause.
      - name: auto-clear conflict label (when synchronize resolves it)
        id: clear-conflict
        if: >
          github.event.action == 'synchronize' &&
          contains(github.event.pull_request.title, '(sync #') &&
          contains(needs.pr-label.outputs.labels, 'sync') &&
          contains(needs.pr-label.outputs.labels, 'conflict') &&
          !contains(needs.pr-label.outputs.labels, 'pending') &&
          (
            github.base_ref == 'main' ||
            needs.build.result == 'success' ||
            needs.build.result == 'skipped'
          )
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ secrets.PAT }}
        shell: python3 {0}
        run: |
          # Inline Python for explicit subprocess error handling — keeps
          # the failure paths (gh non-zero, timeout, markers present,
          # mergeable not ready) all visible without shell traps like
          # set -e / pipefail / SIGPIPE.
          import os
          import re
          import subprocess
          import sys
          import time

          PR = os.environ["PR_NUMBER"]
          REPO = os.environ["REPO"]

          def run_gh(args, timeout=30):
              """Invoke gh CLI. Returns (rc, stdout, stderr). Never raises."""
              try:
                  r = subprocess.run(
                      ["gh", *args],
                      capture_output=True, text=True, timeout=timeout, check=False,
                  )
                  return r.returncode, r.stdout, r.stderr
              except subprocess.TimeoutExpired:
                  return -1, "", "timeout"

          def keep_label(reason):
              """Log + exit 0 — leave conflict label, let next synchronize retry."""
              print(f"::notice::{reason} — keeping conflict label.")
              sys.exit(0)

          # 1. Marker guard: fetch diff, refuse if any markers present.
          rc, diff, err = run_gh(["pr", "diff", PR, "-R", REPO], timeout=60)
          if rc != 0:
              keep_label(f"gh pr diff failed (rc={rc}): {err.strip()[:200]}")

          marker_re = re.compile(r"^\+(<{7}|>{7}|={7})( |$)", re.MULTILINE)
          hits = marker_re.findall(diff)
          if hits:
              keep_label(f"Conflict markers still present in head ref diff ({len(hits)} line(s))")

          # 2. Mergeable poll: GitHub computes async, retry on UNKNOWN.
          mergeable = "UNKNOWN"
          for _ in range(3):
              rc, out, err = run_gh(
                  ["pr", "view", PR, "-R", REPO, "--json", "mergeable", "-q", ".mergeable"]
              )
              if rc != 0:
                  keep_label(f"gh pr view failed (rc={rc}): {err.strip()[:200]}")
              mergeable = out.strip()
              if mergeable != "UNKNOWN":
                  break
              time.sleep(3)

          if mergeable != "MERGEABLE":
              keep_label(f"PR mergeable={mergeable}")

          # 3. Remove the live conflict label.
          rc, _, err = run_gh(
              ["api", "--method", "DELETE",
               f"/repos/{REPO}/issues/{PR}/labels/conflict"]
          )
          if rc != 0:
              print(f"::warning::Failed to remove conflict label (rc={rc}, already gone? race?): {err.strip()[:200]}")
              sys.exit(0)

          # 4. Signal the rescue trio downstream.
          out_path = os.environ.get("GITHUB_OUTPUT")
          if out_path:
              with open(out_path, "a") as f:
                  f.write("conflict_cleared=true\n")
          print("Successfully cleared stale conflict label.")

      # Rescue auto-merge when the sibling `auto-merge` job was skipped
      # because the pr-label snapshot still contained ERROR or conflict
      # (stale before this run cleared it). Mirrors `auto-merge` job's
      # three actions.
      #
      # Two trigger paths:
      #   A. snapshot has ERROR (no conflict) — original doc 015 case
      #   B. snapshot had conflict and this run's `clear-conflict` step
      #      removed the live label (doc 004 case)
      - name: add automerge label (rescue after stale label clear)
        if: >
          needs.be-ut-refactor-compile.result != 'failure' &&
          needs.be-ut-refactor-compile.result != 'cancelled' &&
          (
            github.base_ref == 'main' ||
            needs.build.result == 'success' ||
            needs.build.result == 'skipped'
          ) &&
          contains(github.event.pull_request.title, '(sync #') &&
          contains(needs.pr-label.outputs.labels, 'sync') &&
          !contains(needs.pr-label.outputs.labels, 'pending') &&
          (
            (
              contains(needs.pr-label.outputs.labels, 'ERROR') &&
              !contains(needs.pr-label.outputs.labels, 'conflict')
            ) ||
            steps.clear-conflict.outputs.conflict_cleared == 'true'
          )
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: automerge

      - name: auto-approve (rescue after stale label clear)
        if: >
          needs.be-ut-refactor-compile.result != 'failure' &&
          needs.be-ut-refactor-compile.result != 'cancelled' &&
          (
            github.base_ref == 'main' ||
            needs.build.result == 'success' ||
            needs.build.result == 'skipped'
          ) &&
          contains(github.event.pull_request.title, '(sync #') &&
          contains(needs.pr-label.outputs.labels, 'sync') &&
          !contains(needs.pr-label.outputs.labels, 'pending') &&
          (
            (
              contains(needs.pr-label.outputs.labels, 'ERROR') &&
              !contains(needs.pr-label.outputs.labels, 'conflict')
            ) ||
            steps.clear-conflict.outputs.conflict_cleared == 'true'
          )
        uses: hmarr/auto-approve-action@v3
        with:
          review-message: "Auto approved sync PR"
          github-token: ${{ secrets.APPROVE_PAT }}

      - name: enable automerge (rescue after stale label clear)
        if: >
          needs.be-ut-refactor-compile.result != 'failure' &&
          needs.be-ut-refactor-compile.result != 'cancelled' &&
          (
            github.base_ref == 'main' ||
            needs.build.result == 'success' ||
            needs.build.result == 'skipped'
          ) &&
          contains(github.event.pull_request.title, '(sync #') &&
          contains(needs.pr-label.outputs.labels, 'sync') &&
          !contains(needs.pr-label.outputs.labels, 'pending') &&
          (
            (
              contains(needs.pr-label.outputs.labels, 'ERROR') &&
              !contains(needs.pr-label.outputs.labels, 'conflict')
            ) ||
            steps.clear-conflict.outputs.conflict_cleared == 'true'
          )
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.APPROVE_PAT }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash

  auto-merge:
    needs: [pr-label, code-checker, build, be-ut-refactor-compile]
    name: Auto Merge
    runs-on: [ self-hosted, sync-normal ]
    if: >
      always() &&
      contains(github.event.pull_request.title, '(sync #') &&
      contains(needs.pr-label.outputs.labels, 'sync') &&
      !contains(needs.pr-label.outputs.labels, 'conflict') &&
      !contains(needs.pr-label.outputs.labels, 'pending') &&
      !contains(needs.pr-label.outputs.labels, 'ERROR') &&
      needs.be-ut-refactor-compile.result != 'failure' &&
      needs.be-ut-refactor-compile.result != 'cancelled' &&
      (
        github.base_ref == 'main' ||
        needs.build.result == 'success' ||
        needs.build.result == 'skipped'
      )
    steps:
      - name: clean
        run: |
          # Keep .git so actions/checkout reuses the clone and fetches incrementally
          git -C ${{ github.workspace }} clean -ffdxq 2>/dev/null || { rm -rf ${{ github.workspace }}; mkdir -p ${{ github.workspace }}; }

      - name: add automerge label
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: automerge

      - uses: hmarr/auto-approve-action@v3
        with:
          review-message: "Auto approved sync PR"
          github-token: ${{ secrets.APPROVE_PAT }}

      - name: automerge
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.APPROVE_PAT }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
