# Check that the SQL-Tester case files a PR touches are shaped so their cases actually run.
#
# Flow only. Every step lives in build-support/ci_case_files.sh, including the decision of
# whether this PR has anything in scope -- see that file for why there is no `paths:` filter
# here (CASE FILES is a required check, and a workflow a filter keeps from starting reports
# nothing at all, blocking the PR forever).
name: CI SQL-Tester Case Files

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - 'branch*'

permissions:
  contents: read
  pull-requests: read

jobs:
  case-files:
    runs-on: ubuntu-latest
    name: CASE FILES
    steps:
      # Shallow on purpose: the script deepens the history itself, and only once it has
      # established that this PR touches something this check looks at.
      - uses: actions/checkout@v4

      - name: CASE FILES
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: bash build-support/ci_case_files.sh
