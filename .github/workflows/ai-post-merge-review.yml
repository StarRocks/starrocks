name: AI POST-MERGE REVIEW

# Trigger half of the post-merge severe-risk review chain. On merge to main, ask
# codex (via ci_robot, as CelerData-Reviewer) to re-review the diff with REVIEW.md.
# Returns in seconds -- no polling. The report half (ai-post-merge-review-report.yml)
# sweeps these runs on a schedule and opens the tracking issue.

# Put the PR number in the run title so the report sweep can read it straight from the
# run (display_title) without a head_sha -> PR lookup.
run-name: "AI Post-Merge Review · PR #${{ github.event.pull_request.number }}"

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  trigger:
    name: AI Post-Merge Review (trigger)
    # Skip Doc/UT (by title) and sync PRs (by label); only main + be/fe (gated in the script).
    if: >
      github.event.pull_request.merged == true &&
      github.base_ref == 'main' &&
      github.repository == 'CelerData/celerdata-enterprise' &&
      !startsWith(github.event.pull_request.title, '[Doc]') &&
      !startsWith(github.event.pull_request.title, '[UT]') &&
      !startsWith(github.event.pull_request.title, '[Tool]') &&
      !contains(github.event.pull_request.labels.*.name, 'sync')
    # quick (not light): the job needs the /var/lib/ci-tool bind-mount to run the
    # orchestration script, which only the ci-tool-equipped pools (quick/normal)
    # carry -- light is a deliberately ci-tool-free pool. This is now a seconds-long
    # event-driven job, so it no longer holds a quick runner the way the old poll did.
    runs-on: [self-hosted, quick]
    steps:
      - name: trigger codex post-merge review
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          MODE: trigger
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_ROBOT_URL: ${{ vars.CI_ROBOT_URL }}
        run: |
          rm -rf ./ci-tool && cp -rf /var/lib/ci-tool ./ci-tool
          # git pull is best-effort: the bind-mounted copy is already runnable, so a
          # transient fetch failure must not block the job -- fall back to it and go on.
          cd ci-tool && (git pull || true)
          python3 bin/post_merge_review.py
