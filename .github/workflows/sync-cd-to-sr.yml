name: Sync CD to SR
run-name: Sync CD to SR (dry_run=${{ inputs.dry_run }})

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print candidate PRs, do not sync'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: [self-hosted, sync-normal]
    env:
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
    steps:
      - name: checkout tools
        run: |
          cp -rf /var/lib/elastic-service ./elastic-service
          cd elastic-service && git pull || echo "git pull failed, using cached"
      - name: run scanner
        run: |
          cd elastic-service
          FLAG="--dry-run"
          if [[ "${{ inputs.dry_run }}" == "false" ]]; then FLAG="--no-dry-run"; fi
          python3 lib/sync_cd_to_sr.py $FLAG
