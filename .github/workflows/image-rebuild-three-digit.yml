name: IMAGE REBUILD (three-digit branches)

# Mirrors the `thirdparty-filter` + `thirdparty-update-image` jobs and the
# version label from ci-merged.yml, scoped to three-digit patch branches
# (branch-X.Y.Z) which ci-merged.yml's branch pattern `branch-[0-9].[0-9]`
# does NOT match. Without this, a PR that touches thirdparty/** merged
# into a three-digit branch leaves the official dev-env image stale,
# causing:
#   - silent CVE-scan blind spot (the scan reads the official image)
#   - probabilistic BUILD failures on subsequent PRs that hit the
#     thirdparty change
#   - dockerhub public dev-env image stays stale (see
#     elastic-update-image.sh:26-29, StarRocks-side rebuild also pings
#     the Jenkins job that publishes to dockerhub)
#
# Why a separate workflow (not extending ci-merged.yml's `on:`): only the
# image rebuild and the version label apply to a patch branch, none of
# ci-merged.yml's backport jobs. `get_next_release_tag.sh` returns a
# three-digit base's own version (branch-4.0.18 -> 4.0.18); it used to
# assume `branch-X.Y` and produce a four-digit `version:4.1.1.X`.
#
# Branch pattern uses `[0-9]+` per segment so multi-digit minors like
# branch-4.10.0 are also covered. Pre-release suffixes (branch-4.1.1-rc01)
# are NOT matched — same convention as ci-merged.yml's two-digit pattern.

on:
  pull_request_target:
    branches:
      - "branch-[0-9]+.[0-9]+.[0-9]+"
    types:
      - closed

permissions:
  pull-requests: write
  issues: write
  actions: write
  # get_next_release_tag.sh reads /tags and /branches with GITHUB_TOKEN; with an explicit
  # permissions block unlisted scopes default to none, so contents:read is spelled out.
  contents: read

env:
  PR_NUMBER: ${{ github.event.number }}

jobs:
  # ci-merged.yml labels every PR merged to a release branch, in `update_backport_merged_msg`,
  # which never runs for a three-digit base: PRs merged to branch-4.0.18 got no version label
  # (28 of them in 4.0.16..4.1.7, labelled by hand on 2026-11-17). Same steps as there.
  version_label:
    runs-on: [self-hosted, quick]
    if: github.event.pull_request.merged == true
    steps:
      - name: prepare version label
        id: prepare_version_label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf ./ci-tool && cp -rf /var/lib/ci-tool ./ci-tool && cd ci-tool && git pull >/dev/null
          version=$(./scripts/get_next_release_tag.sh)
          version_label="version:${version}"
          echo "LABEL=${version_label}" >> $GITHUB_OUTPUT
          gh label create "${version_label}" -R ${GITHUB_REPOSITORY} -c 1d76db -f

      - name: add version label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_LABEL: ${{ steps.prepare_version_label.outputs.LABEL }}
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" -f "labels[]=${VERSION_LABEL}"

  # Freeze-window correction, the usual order: the same change merged to branch-X.Y days ago
  # and is labelled X.Y.(Z+1); this patch-branch copy means users get it in X.Y.Z, so the
  # branch-X.Y PR's label is lowered (ci-tool scripts/reconcile-version-label.py).
  reconcile-version-label:
    runs-on: [self-hosted, quick]
    if: github.event.pull_request.merged == true
    # Label accuracy is not worth a red pipeline on a PR that is already merged.
    continue-on-error: true
    env:
      REPO: ${{ github.repository }}
      BASE_REF: ${{ github.base_ref }}
      PR_NUMBER: ${{ github.event.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Reconcile version label
        run: |
          rm -rf ./ci-tool && cp -rf /var/lib/ci-tool ./ci-tool && cd ci-tool && (git pull -q || true)
          python3 scripts/reconcile-version-label.py

  thirdparty-filter:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    outputs:
      thirdparty: ${{ steps.filter-info.outputs.thirdparty }}
      centos7: ${{ steps.distro.outputs.centos7 }}
      rocky9: ${{ steps.distro.outputs.rocky9 }}
    steps:
      - uses: dorny/paths-filter@v3
        id: linux-thirdparty-filter
        with:
          predicate-quantifier: every
          filters: |
            thirdparty:
              - 'thirdparty/**'
              - '!thirdparty/build-thirdparty-darwin.sh'
              - '!thirdparty/vars-darwin-aarch64.sh'
            dev_env:
              - 'docker/dockerfiles/dev-env/dev-env.Dockerfile'

      - name: Prepare filter info
        id: filter-info
        run: |
          thirdparty=false
          if [[ "${{ steps.linux-thirdparty-filter.outputs.thirdparty }}" == 'true' || "${{ steps.linux-thirdparty-filter.outputs.dev_env }}" == 'true' ]]; then
            thirdparty=true
          fi
          echo "thirdparty=${thirdparty}" >> $GITHUB_OUTPUT

      - name: Decide distros by version
        id: distro
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # rocky9 replaces centos7 from 4.2 onward (CentOS 7 EOL):
          #   < 4.2  -> ubuntu + centos7
          #   >= 4.2 -> ubuntu + rocky9
          # Without this, a three-digit branch promotes a distro whose per-PR
          # source image was never built (e.g. rocky9 on branch-4.1.x), and
          # elastic-update-image.sh's `imagetools create` fails with "not found".
          ver=${BASE_REF#branch-}; major=${ver%%.*}; rest=${ver#*.}; minor=${rest%%.*}
          if (( major > 4 || (major == 4 && minor >= 2) )); then
            echo "centos7=false" >> $GITHUB_OUTPUT; echo "rocky9=true"  >> $GITHUB_OUTPUT
          else
            echo "centos7=true"  >> $GITHUB_OUTPUT; echo "rocky9=false" >> $GITHUB_OUTPUT
          fi

  thirdparty-update-image:
    needs: thirdparty-filter
    runs-on: [self-hosted, normal]
    name: Thirdparty Update Image
    if: github.event.pull_request.merged == true && needs.thirdparty-filter.outputs.thirdparty == 'true'
    env:
      PR_NUMBER: ${{ github.event.number }}
      BRANCH: ${{ github.base_ref }}
      REPO: ${{ github.repository }}
    steps:
      - name: clean
        run: |
          rm -rf ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}

      - name: update image - ubuntu
        run: |
          rm -rf ./ci-tool && cp -rf /var/lib/ci-tool ./ci-tool && cd ci-tool && git pull && source lib/init.sh
          ./bin/elastic-update-image.sh $BRANCH $PR_NUMBER ubuntu

      - name: update image - centos7
        if: needs.thirdparty-filter.outputs.centos7 == 'true'
        run: |
          rm -rf ./ci-tool && cp -rf /var/lib/ci-tool ./ci-tool && cd ci-tool && git pull && source lib/init.sh
          ./bin/elastic-update-image.sh $BRANCH $PR_NUMBER centos7

      - name: update image - rocky9
        if: needs.thirdparty-filter.outputs.rocky9 == 'true'
        run: |
          rm -rf ./ci-tool && cp -rf /var/lib/ci-tool ./ci-tool && cd ci-tool && git pull && source lib/init.sh
          ./bin/elastic-update-image.sh $BRANCH $PR_NUMBER rocky9

      - name: Clean ENV
        if: always()
        run: |
          rm -rf ${{ github.workspace }}/*
