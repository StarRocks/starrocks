commands_restrictions:
  backport:
    conditions:
      - or:
          - sender-permission>=read
          - sender=github-actions[bot]

  rebase:
    conditions:
      - or:
          - sender-permission>=read
          - sender=github-actions[bot]

pull_request_rules:
  - name: assign PRs with the pr author
    conditions:
      - -merged
    actions:
      assign:
        add_users:
          - "{{ author }}"

  - name: notify author when backport conflicts
    conditions:
      - label=conflicts
    actions:
      comment:
        # The author of a backport is Mergify itself; its assignees are the people to ping.
        message: "{% for login in assignee %}@{{ login }} {% endfor %}This backport has
          conflicts. Resolve them on this branch and push, then remove the `conflicts`
          label; or close it and open your own backport PR."
