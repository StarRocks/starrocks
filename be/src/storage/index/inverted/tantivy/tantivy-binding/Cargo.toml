[package]
name = "tantivy-binding"
version = "0.1.0"
edition = "2021"
description = "Rust FFI binding crate exposing tantivy to StarRocks BE via a C ABI."
license = "Apache-2.0"
publish = false

[lib]
name = "tantivy_binding"
crate-type = ["staticlib", "rlib"]

[dependencies]
# Tantivy is consumed via a relative path into the contrib/ submodule. The
# depth of "../" hops walks up from this Cargo.toml to the repo root and back
# down into contrib/tantivy. If you move this crate, update this path.
#
#   be/src/storage/index/inverted/tantivy/tantivy-binding/Cargo.toml
#   ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
#   1   2   3       4     5        6       7
tantivy = { path = "../../../../../../../contrib/tantivy" }
ik-rs = "0.7"
jieba-rs = "0.7"
libc = "0.2"
# Used by `like_pattern_to_regex` to escape literal segments before feeding
# the pattern into `tantivy::query::RegexQuery`.
regex = { version = "1.5", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pin the upstream source commit: the crates.io 0.7.0 package accidentally
# promotes its Tantivy 0.21 dev-dependency to a normal dependency, which would
# link a second Tantivy version into the BE.
tantivy-ik = { git = "https://github.com/blueshen/tantivy-ik.git", rev = "30a4a63dc41e52a69606bf1d03fcda6e4fc46c53", default-features = false, features = ["use-std-sync"] }
# tantivy-ik 0.7 implements the 0.2 tokenizer API. Keep that API under an
# explicit alias so the adapter can bridge its tokens to the in-tree Tantivy.
tantivy-tokenizer-api-v02 = { package = "tantivy-tokenizer-api", version = "0.2" }

[build-dependencies]
cbindgen = "0.27"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Keep panic=unwind to match BE's exception-based runtime; an abort policy
# would require special handling for cross-FFI panics.
opt-level = 3
lto = false
debug = 1
