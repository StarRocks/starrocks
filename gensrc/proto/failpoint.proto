syntax = "proto2";

// Failpoint trigger-mode types, split out of internal_service.proto so that
// be/src/base/failpoint/fail_point.h, which test builds include in hundreds of translation units,
// only needs this small generated header. Message and enum names are unchanged, so the wire
// format and the generated C++/Java classes are identical.

package starrocks;
option java_package = "com.starrocks.proto";

enum FailPointTriggerModeType {
    ENABLE = 1;
    DISABLE = 2;
    PROBABILITY_ENABLE = 3;
    ENABLE_N_TIMES = 4;
}

message PFailPointTriggerMode {
    optional FailPointTriggerModeType mode = 1;
    optional double probability = 2;
    optional int32 n_times = 3;
    // STORED/REPORTED pause state, lifted out of PUpdateFailPointStatusRequest by
    // trigger_mode_from_request (or set by the conf-file parser). A client never sets these on a
    // request -- see PUpdateFailPointStatusRequest in internal_service.proto for why.
    optional bool pause = 4;
    optional int32 pause_timeout_second = 5;
}
